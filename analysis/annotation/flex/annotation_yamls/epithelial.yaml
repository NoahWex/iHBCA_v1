resolution_cap: '3.0'

note: |
  Track C FLEX Epithelial L2S annotation. Anchor at leiden_0.3 (10 clusters) — chosen
  to avoid BMYO overclustering (at 1.0 BMYO splits into 7 myo + 3 basal sub-clusters
  reflecting continuous variation, not real substates). At 0.3 BMYO collapses to
  c0 (myo-core, 53K) + c3 (basal-core, 5K) + c5/c6 (small variants).
  Debris cluster c4 (CD74+IGHA1+heavy MT-* + ribosomal) flagged as ARTIFACT_lowqc.
  Substates folded at this anchor (recoverable via fine_cluster_overrides if needed):
    LASP-basal transitional (KLK5/7+KRT6B+RARRES1, ~5.7K cells at 1.0_c8) → folds into c1
    Apocrine-LHS (ABCC11+PIP+TAT, ~6.3K at 1.0_c7) → folds into c2
    HSP-high BMYO sub-state (~1.1K at 1.0_c12) → folds into c0 (FFPE blocks
      dissociation HSP induction, so this likely reflects real HSP-elevated biology
      rather than artifact; held within BMYO-myo because no biologically distinct
      identity emerges beyond elevated chaperones)
    Cycling LASP (HIST1H1+MCM7+HELLS, ~612 at 1.0_c13) → folds into c1
    CD74+ epithelial (~431 at 1.0_c16) → folds into c1
  No fine_cluster overrides applied initially — keep simple, lift specific substates if
  the canonical/top heatmaps reveal under-resolved biology.
  Evidence per cluster:
    - ucell_top, ucell_top_score, ucell_runner_up, ucell_margin: UCell argmax against V1 yaml signatures
    - limma_top_markers: top de novo markers from limma-voom (one-vs-rest, ~ library_id + condition)
    - novelty_flags: low_confidence / tight_margin / marker_mismatch (informational, not auto-relabel)

evidence_paths:
  ucell_per_cluster: outputs/ucell/Epithelial_ucell_per_cluster.csv
  ucell_per_cell: outputs/ucell/Epithelial_ucell_per_cell.csv
  limma_top: outputs/limma/limma_top_markers_Epithelial_leiden_*.csv
  limma_full: outputs/limma/limma_markers_Epithelial_leiden_*.csv
  assignments: outputs/assignments/Epithelial_leiden_*_assignments.csv
  structural_plots: outputs/Epithelial/structural/

