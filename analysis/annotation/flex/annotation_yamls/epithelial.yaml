# fine_cluster_overrides — recover LASP-basal substate that 0.3 anchor folds into LASP-major.
fine_cluster_overrides:
  lasp_basal_recovery:
    resolution: '1.0'
    anchor_clusters: [c1]
    rationale: |
      At 0.3 anchor c1 (LASP-major, 22.9K cells) hides a large LASP-basal transitional
      substate. At 1.0 it splits cleanly into LASP-major core (1.0_c0, 15.6K) and a
      LASP-basal subset (1.0_c8, n=5653) with markers RGS2+KLK5/7+RARRES1+KRT6B+KRT23+
      ALDH1A3+CHI3L1+PTN — KRT6B/KRT23 are basal keratins, KLK5/7 are LASP secretory
      kallikreins. UCell tight margin (0.04) confirms it sits between LASP-major and
      LASP-basal. Also 1.0_c8 has runner_up = LASP-basal in UCell.
    overrides:
      - {resolution: '1.0', cluster: 8, label: LASP-basal}

  lhs_apocrine_aggregation:
    resolution: '1.0'
    anchor_clusters: [c2, c9]
    rationale: |
      0.3_c8 + 0.3_c9 (n=257 combined) are the apocrine drifters at top of UMAP and
      get LHS-apocrine via the anchor — but their pseudobulk limma is empty (too few
      libraries). 1.0_c18 (n=255) traces the same apocrine signature with adequate
      limma support (DHRS2+SERHL2+ABCC11+APOD+ALOX15B+PIP+ALDH3B2+SCP2+ACACA+ACAA1
      — textbook apocrine). Adding 1.0_c18 override pulls ~173 additional apocrine
      cells out of LHS-major (0.3_c2 mass) AND gives LHS-apocrine a marker row in
      heatmap_top. Final LHS-apocrine ≈ 430 cells.
    overrides:
      - {resolution: '1.0', cluster: 18, label: LHS-apocrine}
