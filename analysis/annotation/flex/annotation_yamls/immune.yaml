note: |
  Track C FLEX annotation (L2S labels). Anchor at leiden_1.0 (24 clusters); fine_cluster
  overrides applied at 1.5 (Treg/CD4_Tcm split) and 3.0 (CD4 vs CD8 lineage split in c0,
  cDC2/Mono_NC/Macro_FOLR2 split in c9). Resolution mixed across anchor + 1.5 + 3.0 per
  V1 v2 pattern (mixed-resolution annotation precedented in V1 stromal + epithelial).
  Cap raised from 1.5 to 3.0 after observing that 3.0 cleanly separates lineage in c0
  (mixed naive T) — at 1.5 c0 stays one cluster, at 3.0 it splits into 2 CD4 sub-clusters
  + 1 CD8_Resting + 1 CD8_Tem (KLRG1+PRF1+).
  Evidence per cluster:
    - ucell_top, ucell_top_score, ucell_runner_up, ucell_margin: UCell argmax against V1 yaml signatures
    - limma_top_markers: top de novo markers from limma-voom (one-vs-rest, ~ library_id + condition)
    - novelty_flags: low_confidence / tight_margin / marker_mismatch (informational, not auto-relabel)
  All assigned_label values reviewed against structural diagnostics, V1 canonical+identity
  marker heatmaps, top-marker heatmaps, label UMAP, and per-V1-label feature plots
  (outputs/Immune/{structural,featureplots,annotation}/). review_status: locked.

evidence_paths:
  ucell_per_cluster: outputs/ucell/Immune_ucell_per_cluster.csv
  ucell_per_cell: outputs/ucell/Immune_ucell_per_cell.csv
  limma_top: outputs/limma/limma_top_markers_Immune_leiden_*.csv
