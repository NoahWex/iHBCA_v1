  assignments: outputs/assignments/Immune_leiden_*_assignments.csv
  concordance: outputs/concordance/Immune_resolution_concordance.csv
  recommendations: outputs/concordance/Immune_resolution_recommendations.csv
  structural_plots: outputs/Immune/structural/

