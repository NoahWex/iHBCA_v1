# fine_cluster overrides — populated during review for substates the 1.0 anchor merges.
# Pattern: pick a higher resolution that splits the substate, then list the (resolution, cluster)
# tuples and the override label. See V1 v2 yaml for example.
fine_cluster_overrides:
  treg_split:
    resolution: '3.0'
    anchor_clusters: [c7]
    rationale: |
      Anchor c7 mixes CD4_Th_like with Treg. At 3.0 the Treg signature concentrates
      into 3.0_c20 (n=917): CTLA4 lfc=5.86, TIGIT 4.92, BATF 3.60, CCR7 down to 1.64.
      Sharper than the 1.5 split (1.5_c15, n=732, CTLA4 6.17). FOXP3 confirmed via
      featureplot. The c7 anchor remainder (3.0_c13, n=1477) is CD4_Tcm-leaning
      (CCR7 5.10, TCF7 5.25) and inherits CD4_Th_like.
    overrides:
      - {resolution: '3.0', cluster: 20, label: Treg}

  cd4_cd8_lineage_split:
    resolution: '3.0'
    anchor_clusters: [c0]
    rationale: |
      Anchor c0 (n=6335) is pan-naive T at 1.0 and 1.5 (genuinely mixed CD4/CD8 with
      CD4 lfc=1.38, CD8A lfc=1.91, CCR7+TCF7+IL7R). At 3.0 it cleanly resolves:
      majority CD4 (3.0_c1+c11, 4655 cells), CD8 resting (3.0_c16, n=943), CD8 effector
      with KLRG1+PRF1+ (3.0_c29, n=515). Anchor flipped to CD4_Th_like (majority).
    overrides:
      - {resolution: '3.0', cluster: 16, label: CD8_Resting}
      - {resolution: '3.0', cluster: 29, label: CD8_Tem}
      # 3.0_c1 and c11 inherit CD4_Th_like from the c0 anchor.

  cdc2_mono_macro_split:
    resolution: '3.0'
    anchor_clusters: [c9]
    rationale: |
      Anchor c9 (n=2043) is cDC2-leaning at 1.0/1.5 but markers mix DC, monocyte, and a
      small macrophage subset. At 3.0 splits into clean cDC2 (3.0_c19, CD1C+FCER1A+
      CLEC10A, low CD14), classical-leaning Mono_NC (3.0_c22, VCAN+S100A8/9+CD14+FCAR),
      and a Macro_FOLR2 subset (3.0_c18, CD163L1+CLEC7A+LYVE1).
    overrides:
      - {resolution: '3.0', cluster: 22, label: Mono_NC}
      - {resolution: '3.0', cluster: 18, label: Macro_FOLR2}
      # 3.0_c19 inherits cDC2 from the c9 anchor.
