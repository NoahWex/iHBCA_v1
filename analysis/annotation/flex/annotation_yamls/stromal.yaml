note: |
  Track C FLEX Stromal L2S annotation. Anchor at leiden_0.5 (15 clusters, 119,141 cells)
  — chosen because 0.3 collapses important biology (Adipocyte merges into VSMC_stress,
  Vas-capillary merges into Vas-vein, Pericyte merges into VSMC, Vas-arterial misnamed
  as Vas-vein). At 0.5 the pipeline cleanly separates:
    - 3 vascular endothelial subtypes (Vas-vein, Vas-arterial, Vas-capillary)
    - VSMC vs Pericyte (separated by NOTCH3+ABCC9+ADGRF5 pattern in pericyte)
    - Adipocyte (PLIN1+CIDEA+ADIPOQ+DGAT2+FASN — FLEX-novel, V1 had no adipocyte label)
    - Fibro-SFRP4 (SFRP4+GREB1+OGN+PBX1 — FLEX-novel, ER-responsive fibroblast subset)
  Two FLEX-novel labels (Adipocyte, Fibro-SFRP4) introduced because V1 stromal yaml
  doesn't subset adipose-derived stroma or SFRP4+ fibroblasts.
  Adipocyte further resolves into three lipid-cycle substates at leiden_3.0 (see
  fine_cluster_overrides): Adipo-storage / Adipo-lipolysis / Adipo-lipogenic. UCP1
  is ~0 in all three, so these are white-adipose functional states, not brown/beige.
  Fibro-prematrix similarly resolves into three subsets at leiden_1.0: matrix-
  synthetic core (Fibro-prematrix, PI16+CD55+SCARA5+), perivascular reservoir
  (Fibro-perivascular, C7+SVEP1+LAMA2+, ECM-low), and contractile myofibroblast
  (Fibro-myo, TAGLN+CALD1+MYL9+, MYH11- to distinguish from VSMC).
  Several clusters share UCell argmax with their dominant V1 label but limma markers
  unambiguously override (e.g., 0.3_c3 was UCell-called VSMC_stress but its limma
  markers are textbook adipocyte). UCell calls used as informational, not authoritative.
  Evidence per cluster:
    - ucell_top, ucell_top_score, ucell_runner_up, ucell_margin: UCell argmax against V1 yaml signatures
    - limma_top_markers: top de novo markers from limma-voom (one-vs-rest, ~ library_id + condition)
    - novelty_flags: low_confidence / tight_margin / marker_mismatch (informational, not auto-relabel)

