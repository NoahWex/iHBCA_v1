# fine_cluster_overrides — three-way Adipocyte split at leiden_3.0 within c4@0.5.
# Within-Adipocyte one-vs-rest wilcoxon (12,125 cells split 5,722/3,671/2,655)
# resolved three coherent lipid-cycle states. UCP1 ≈ 0 across all three rules out
# brown/beige; these are functional substates of white adipose. AP-1 (FOS/FOSB/JUN)
# in Adipo-lipolysis is downstream of β-adrenergic / lipolytic signaling and is
# coherent with the lipolysis program — FFPE embedding largely blocks dissociation-
# induced AP-1, so this is most parsimoniously real biology, not fixation artifact.
fine_cluster_overrides:
  adipocyte_storage:
    resolution: '3.0'
    anchor_clusters: [c4]
    rationale: |
      3.0_c24 (n=2,655) within Adipocyte anchor. Storage-dominant white adipocyte:
      highest PLIN1 (4.55, 100% pct), GPAM (2.60), AQP7 (2.73, glycerol channel),
      ACACB. Insulin pathway elevated (IRS1, AKT2, INSR, PPARG 2.27) — classic
      insulin-responsive TG-storage state. Lowest LEP, lowest mito-OXPHOS panel,
      lowest SCD. Quiescent storage-engaged.
      Note: this override is functionally redundant with the c4@0.5 anchor (which
      is now also Adipo-storage), retained for documentation symmetry — every
      sub-state has an explicit definition block. Cells in 3.0_c24 receive
      Adipo-storage from anchor; this override re-asserts the same label.
    overrides:
      - {resolution: '3.0', cluster: 24, label: Adipo-storage}

  adipocyte_lipolysis:
    resolution: '3.0'
    anchor_clusters: [c4]
    rationale: |
      3.0_c0 (n=5,722) within Adipocyte anchor. Lipolytic white adipocyte: highest
      PNPLA2 (ATGL, 4.26), PLIN5 (2.61), ABHD5 (1.26) — TG-lipase coactivation.
      AP-1 burst (FOS, FOSB, JUN, KLF4/6, NFKBIZ, ZFP36, DUSP1, ANGPTL4) is
      downstream of β-adrenergic / lipolytic signaling in adipocytes (well
      documented in adrenergic-stimulated lipolysis), so co-occurrence with the
      lipase panel is consistent. HSPs are lowest in this sub (HSPA1A 0.16 vs
      0.71 c24) — not the heat-shock pattern, distinct from any FFPE concern.
    overrides:
      - {resolution: '3.0', cluster: 0, label: Adipo-lipolysis}

  adipocyte_lipogenic:
    resolution: '3.0'
    anchor_clusters: [c4]
    rationale: |
      3.0_c8 (n=3,671) within Adipocyte anchor. Metabolically active white
      adipocyte: SCD 2.98 (vs 0.89/0.58 in others) — strong de novo lipogenesis.
      Mito-encoded OXPHOS panel uniformly highest (COX7A1 1.01 vs 0.30; ATP5F1A
      0.63 vs 0.15; NDUFA1 0.42 vs 0.12; MT-CO/ND/ATP6 dominate one-vs-rest).
      Highest LEP (1.65), ADIPOQ (3.55), FABP4 (4.36), CIDEC — lipogenic +
      OXPHOS-engaged + secretory. Not brown/beige (UCP1 ≈ 0).
    overrides:
      - {resolution: '3.0', cluster: 8, label: Adipo-lipogenic}

  prematrix_perivascular_split:
    resolution: '1.0'
    anchor_clusters: [c2]
    rationale: |
      1.0_c4 (n=8,180 within prematrix) splits a perivascular/reticular reservoir
      fibroblast out of c2@0.5. Distinguishing markers (within-prematrix wilcox
      one-vs-rest): C7 (0.60 vs 0.013 in 1.0_c6), SVEP1, LAMA2, ABCA8/9, APOD,
      GPC3, NRP1, IGFBP7, SRPX, SOD2. PDGFRA 1.32 (highest), CXCL12 1.59, CXCL14
      1.12. Bulk collagen LOWER than the matrix-synthetic c6 (COL1A1 2.81 vs
      4.37) — this is a non-ECM-laying fibroblast subset. Profile fits a Buechler-
      style perivascular adventitial reservoir. FLEX-novel label, V1 stromal
      yaml does not split this.
    overrides:
      - {resolution: '1.0', cluster: 4, label: Fibro-perivascular}

  prematrix_myofibroblast_split:
    resolution: '1.0'
    anchor_clusters: [c2, c10]
    rationale: |
      1.0_c16 (n=1,122 within prematrix) is the contractile myofibroblast subset.
      Within-prematrix wilcox: TAGLN 3.56, CALD1 2.64, MYL9 1.34, TPM2 1.12,
      ACTA2 0.44, TPM1, CSRP1, PAPLN, ITGA6+ITGB4 (basement membrane integrins),
      DKK3, RSPO3. MYH11 ≈ 0 distinguishes from VSMC — this is a contractile
      fibroblast, not vascular smooth muscle. c10@0.5 maps monolithically to
      1.0_c16 (only 2 of 1,123 cells fall elsewhere), so the c10 anchor is
      already set to Fibro-myo; this override pulls the small number of 1.0_c16
      cells from c2@0.5 (~1 cell) to keep the label coherent.
    overrides:
      - {resolution: '1.0', cluster: 16, label: Fibro-myo}
