fibroblast_detail:
  resolution: '0.5'
  principle: 'At res=0.5, the two res=0.3 fibroblast clusters (c0+c6) resolve into four populations distinguished by SFRP4
    expression, PDGFRA/B ratio, and AKR1C3 steroidogenic activity. All retain Fibroblast label at L0.5; may warrant L2.0s
    subdivision. A Smooth_Muscle cluster also emerges at res=0.5 (c10); see smooth_muscle_detail section below.

    '
  fib_interstitial:
    cluster: '1'
    label: Fibroblast
    label_short: Fb
    lineage: Fibroblast
    notes: 'Nuclear: FBLN1(4.0,77%), CCDC80(3.7,72%), LUM(3.8,86%), MMP2(3.4,72%), CXCL12(3.0,91%), PDGFRA(3.2,69%). FLEX:
      DCN(3.7,91%), C1S(3.0,87%), COL6A3(2.9,94%), MMP2(3.2,83%), FBLN1(3.4,78%). PDGFRA+ interstitial fibroblast. C1S (complement
      C1s) in FLEX consistent with immune-interacting fibroblast subset. CXCL12-hi.

      '
  fib_sfrp4:
    cluster: '4'
    label: Fibroblast
    label_short: Fb
    lineage: Fibroblast
    notes: 'Nuclear: FBLN1(3.2,67%), CCDC80(2.4,56%), SFRP4(3.4,32%), MMP2(1.4,51%). Cyto: FBLN1(3.1,86%), CCDC80(2.4,82%),
      MMP2(2.0,80%), SFRP4(3.1,48%), CXCL12(0.7,90%). FLEX: ADAM33(2.0,86%), COL1A2(1.7,89%), COL1A1(1.8,89%), TNXB(1.4,83%).
      SFRP4+ fibroblast; SFRP4 marks a distinct stromal subpopulation in breast tissue. Lower CXCL12 than c1. FLEX: ADAM33
      (ADAM metalloprotease, stromal remodeling).

      '
  fib_pdgfrab:
    cluster: '5'
    label: Fibroblast
    label_short: Fb
    lineage: Fibroblast
    notes: 'Nuclear: PDGFRA(3.9,79%), PDGFRB(3.4,83%), LUM(3.8,90%), IGF1(3.4,67%), CXCL12(2.2,87%). Cyto: PDGFRB(2.3,80%),
      PDGFRA(2.5,77%), ITM2C(2.3,67%), IGF1(2.1,72%), LUM(2.2,93%). FLEX: LAMB1(1.7,74%), COL3A1(1.7,89%), PLXDC1(1.8,65%),
      COL6A3(1.6,88%). PDGFRA+/PDGFRB+ dual-positive fibroblast; lower FBLN1/CCDC80 than c1/c4. IGF1+ consistent with signaling-active
      fibroblast. Bridging fibroblast–CAF state?

      '
  fib_akr1c3:
    cluster: '8'
    label: Fibroblast
    label_short: Fb
    lineage: Fibroblast
    notes: 'Nuclear: AKR1C3(defining marker), LUM, FBLN1. AKR1C3 (aldo-keto reductase family 1 member C3; converts androstenedione
      to testosterone, also involved in estrogen metabolism) defines this cluster. LUM/FBLN1 confirm interstitial fibroblast
      identity. AKR1C3 is absent from clusters c1/c4/c5 at this resolution — exclusive marker at res=0.5. Steroidogenically
      active fibroblast subtype; candidate for spatial proximity analysis near hormone-responsive epithelium. Xenium-only
      (no FLEX cells at this resolution). Fibroblast at L0.5; may warrant L2.0s subdivision.

      '
smooth_muscle_detail:
  resolution: '0.5'
  note: 'At res=0.3, smooth muscle signal is subsumed within the c7–c14 artifact clusters (which show PDCD1+GZMK contamination).
    At res=0.5, smooth muscle separates into a clean Xenium-only cluster (c10) with canonical ACTG2/MYH11/ACTA2 markers.

    '
  '10':
    label: Pericyte
    label_short: PV
    lineage: Pericyte
    notes: 'ACTG2/MYH11/ACTA2-dominant contractile cluster. No FLEX cells — NOTCH3/MCAM cannot be verified. Merged with Pericyte
      (c3) at L0.5; cannot distinguish smooth muscle from pericyte without the FLEX pericyte signature.

      '
overrides:
  resolution: '0.7'
  principle: 'At res=0.7, fibroblast subpopulations resolve into three labeled clusters: SFRP4+ hormone-responsive (c10),
    POSTN+ activated (c11, clean), and a contamination-flagged activated cluster (c9, retained but flagged for endothelial
    leakage). Cluster numbering corrected 2026-04-26 per fibroblast multi-marker review (Spatial_HBCA_Xenium/.dev/fig3_render_20260426/):
    prior assignment of Fibroblast_SFRP4 to c9 was incorrect — the SFRP4-high cluster is c10 (Xen mean 1.45/pct 82%, FLEX
    mean 0.73/pct 48%; ESR1 mean 0.37, MGP mean 0.78 FLEX). Cluster 9 carries POSTN/ACTA2/PDGFRB activated signature plus
    PECAM1/VWF endothelial leakage (boundary/doublet artifact); retained as Fibroblast_activated but flagged for QC. Cluster
    11 is a clean second activated cluster (POSTN 0.88, ADAM12 0.86 FLEX, no endothelial leakage). SFRP4 override remains
    triple-concordant (nuclear + FLEX). All three calls confirmed in both Xenium nuclear and FLEX assays.

    '
  '9':
    label: Fibroblast_activated
    label_short: Fb_Activated
    lineage: Fibroblast
    confidence: medium
    base_label_overridden: Fibroblast
    qc_flag: endothelial_contamination_review
    evidence:
      nuclear:
      - 'POSTN: mean=0.76, pct=47.7% (POSTN+ activated signature)'
      - 'ACTA2: mean=0.66, pct=52.9%'
      - 'PDGFRB: mean=0.90, pct=71.8%'
      - 'IGF1: mean=0.50, pct=45.6%'
      - 'PECAM1: mean=0.33, pct=36.5% (CONTAMINATION FLAG: endothelial leakage)'
      - 'VWF: mean=0.28, pct=31.4% (CONTAMINATION FLAG: endothelial leakage)'
      flex:
      - 'POSTN: mean=0.29, pct=22.4%'
      - 'ADAM12: mean=0.46, pct=35.9%'
      - 'PLXDC1: mean=0.66, pct=53.6%'
      - 'PDGFRB: mean=0.76, pct=64.3%'
      panel_genes_present:
      - POSTN
      - ACTA2
      - PDGFRB
      - PECAM1
      - VWF
    notes: 'POSTN+/ACTA2+/PDGFRB+ activated fibroblast with PECAM1/VWF endothelial leakage. Nuclear PECAM1 0.33 / VWF 0.28
      are 26x higher than other fibroblast clusters at res=0.7, suggesting boundary/doublet capture or ambient endothelial
      RNA. Retained as Fibroblast_activated for downstream DA but flagged for QC review. PRIOR LABEL Fibroblast_SFRP4 was
      incorrect — cluster 9 SFRP4 mean is 0.20 nuclear / 0.15 FLEX (pct 18.6% / 12.2%), does not meet SFRP4-high threshold.
      See fibroblast multi-marker review 2026-04-26 for evidence chain.

      '
  '10':
    label: Fibroblast_SFRP4
    label_short: Fb_SFRP4
    lineage: Fibroblast
    confidence: high
    base_label_overridden: Fibroblast
    evidence:
      nuclear:
      - 'SFRP4: mean=1.45, pct=82.0% (highest SFRP4 of any stromal cluster at res=0.7)'
      - 'ESR1: mean=0.37, pct=40.7% (hormone receptor)'
      - 'PGR: mean=0.21, pct=23.2%'
      - 'FBLN1: mean=0.96, pct=73.9% (shared fibroblast marker)'
      - 'CCDC80: mean=0.83, pct=65.5%'
      - 'PECAM1: mean=0.004, pct=0.6% (clean — no endothelial contamination)'
      - 'VWF: mean=0.002, pct=0.3% (clean)'
      flex:
      - 'SFRP4: mean=0.73, pct=47.8% (confirmed in full transcriptome)'
      - 'ESR1: mean=0.20, pct=21.9%'
      - 'MGP: mean=0.78, pct=53.2%'
      - 'FAP: mean=0.14, pct=14.8%'
      - 'FBLN1: mean=0.93, pct=58.4%'
      panel_genes_present:
      - SFRP4
      - ESR1
      - PGR
    notes: 'Hormone-responsive SFRP4+ fibroblast — corrected cluster assignment 2026-04-26 (was incorrectly assigned to c9
      in prior overrides; multi-marker review across both Xenium nuclear and FLEX confirmed c10 is the true SFRP4-high cluster).
      ESR1+/PGR+ co-expression with SFRP4 marks a stromal population responsive to estrogen/progesterone signaling — distinct
      from the fibro-SFRP4 state in Kumar et al. 2023 (which did not describe ESR1 co-expression). SFRP4 (Wnt antagonist)
      in a hormone-responsive stromal context suggests cross-talk between hormone and Wnt signaling pathways in the breast
      stroma. Candidate for spatial proximity analysis near epithelium (CellCharter niche work). Panel-gene scoring for this
      state: SFRP4 + ESR1 + PGR (all available).

      '
  '11':
    label: Fibroblast_activated
    label_short: Fb_Activated
    lineage: Fibroblast
    confidence: high
    base_label_overridden: Fibroblast
    evidence:
      nuclear:
      - 'POSTN: mean=0.88, pct=57.1% (clean POSTN+ activated signature)'
      - 'ACTA2: mean=0.28, pct=28.3%'
      - 'PDGFRB: mean=0.55, pct=56.2%'
      - 'PDGFRA: mean=0.52, pct=53.4%'
      - 'PECAM1: mean=0.001, pct=0.1% (clean — no endothelial contamination)'
      - 'VWF: mean=0.001, pct=0.1% (clean)'
      flex:
      - 'POSTN: mean=0.64, pct=43.9%'
      - 'ADAM12: mean=0.86, pct=61.3% (highest ADAM12 of any stromal cluster)'
      - 'PLXDC1: mean=0.72, pct=57.9%'
      - 'PDGFRB: mean=0.55, pct=52.9%'
      panel_genes_present:
      - POSTN
      - ACTA2
      - PDGFRB
    notes: 'Clean POSTN+/ADAM12+ activated fibroblast. ADAM12 (FLEX) at 0.86 / 61.3% is the highest of any stromal cluster,
      indicating active matrix remodeling. No PECAM1/VWF endothelial contamination (in contrast to c9). Promoted to Fibroblast_activated
      override 2026-04-26 from default Fibroblast assignment. Candidate for joint Milo DA grouped with c1 (res=0.3) activated
      fibroblasts. Evidence chain: fibroblast multi-marker review (Spatial_HBCA_Xenium/.dev/fig3_render_20260426/temp_fibroblast_markers_summary.csv).

      '
