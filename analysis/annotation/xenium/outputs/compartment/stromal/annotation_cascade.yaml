meta:
  compartment: Stromal
  base_resolution: '0.3'
  fibroblast_resolution: '0.5'
  experiment: Stromal_clean

# Canonical full names for L1.5 labels in this compartment.
vocabulary:
  Fibroblast:
    full_name: Fibroblast (interstitial)
    label_short: Fb
    lineage: Fibroblast
    notes: Canonical interstitial fibroblast (FBLN1/CCDC80/LUM/CXCL12+; DCN/COL1A1/COL1A2 in FLEX)
  Fibroblast_activated:
    full_name: Fibroblast (POSTN+ activated)
    label_short: Fb_Activated
    lineage: Fibroblast
    notes: POSTN+/IGF1+/PDGFRB+ activated fibroblast; ADAM12/ADAMTS12 in FLEX. Provisional — pending scVI marker confirmation
  Fibroblast_SFRP4:
    full_name: Fibroblast (SFRP4+ hormone-responsive)
    label_short: Fb_SFRP4
    lineage: Fibroblast
    notes: SFRP4+/ESR1+/PGR+ Wnt-antagonist hormone-responsive fibroblast. Override at res 0.7 cluster c10 (corrected from c9 per fibroblast multi-marker review 2026-04-26)
  Endothelial:
    full_name: Endothelial (blood)
    label_short: EC
    lineage: Endothelial
    notes: Blood endothelial — PECAM1/VWF/AQP1/CD93/MMRN2; FLEX adds RAPGEF3/EGFL7/PTPRB
  "Lymphatic Endothelial":
    full_name: Lymphatic Endothelial
    label_short: LEC
    lineage: Endothelial
    notes: FLT4 (VEGFR3)/TBX1/MRC1/CAVIN2/ANGPT2; distinct from blood EC
  Pericyte:
    full_name: Pericyte (incl. smooth muscle)
    label_short: PV
    lineage: Pericyte
    notes: ACTA2+/NOTCH3+/MCAM+/PDGFRB+; res-0.5 c10 smooth muscle merged here (cannot distinguish without FLEX pericyte signature)
  Adipocyte:
    full_name: Adipocyte
    label_short: Adipo
    lineage: Adipocyte
    notes: ADIPOQ/ADH1B/LPL/PLIN1/PLIN4/PNPLA2 — definitive adipocyte
artifact_vocabulary:
  Immune_artifact: { full_name: "Stromal nucleus capturing immune RNA (PDCD1+/GZMK+ contamination at stromal-immune boundary)" }

base:
  '0':
    label: Fibroblast
    label_short: Fb
    lineage: Fibroblast
    confidence: high
    notes: 'Nuclear: FBLN1(4.6,74%), CCDC80(4.0,67%), MMP2(3.3,66%), LUM(3.4,78%), CXCL12(2.5,84%). Cyto: FBLN1(3.7,87%),
      CCDC80(3.0,84%), MMP2(2.8,84%), CXCL12(1.7,95%), LUM(2.2,89%). FLEX: DCN(3.8,85%), COL1A2(3.5,94%), COL6A3(3.2,89%),
      TNXB(3.0,90%), COL1A1(3.4,93%). Canonical interstitial fibroblast: FBLN1/CCDC80/LUM in Xenium; DCN/COL1A1/COL1A2 in
      FLEX. CXCL12 marks resting/interstitial fibroblast niche. Triple-concordant.

      '
  '1':
    label: Fibroblast_activated
    label_short: Fb_Activated
    lineage: Fibroblast
    confidence: medium
    notes: 'Nuclear: POSTN(6.2,82%), IGF1(5.1,73%), LUM(4.9,92%), PDGFRB(4.0,83%), PDGFRA(4.2,75%). Cyto: POSTN(4.9,85%),
      IGF1(3.7,81%), LUM(3.3,96%), PDGFRB(3.2,85%), ITM2C(3.0,71%). FLEX: ADAM12(3.5,77%), PLXDC1(3.1,79%), COL3A1(2.8,95%),
      POSTN(3.4,63%), ADAMTS12(2.5,72%). POSTN+ activated fibroblast. Distinct from c0 in Concord space by POSTN/PDGFRB signal
      in the 280-gene panel. ADAM12/ADAMTS12 in FLEX suggest remodeling activity, but these markers are absent from the Xenium
      panel. Label is PROVISIONAL: at scVI res=5.0, 45 fibroblast sub-states exist and split heterogeneously across c0 and
      c1 — the Concord split does not correspond to a clean scVI boundary. True label pending scVI marker extraction (run_scvi_fib_markers_stromal.sh).
      Do NOT use "CAF" — CAF requires cancer context.

      '
  '2':
    label: Endothelial
    label_short: EC
    lineage: Endothelial
    confidence: high
    notes: 'Nuclear: PECAM1(8.4,81%), VWF(9.0,79%), AQP1(6.6,84%), CD93(8.1,71%), MMRN2(7.9,66%). Cyto: AQP1(5.0,85%), PECAM1(5.7,79%),
      VWF(6.1,75%), CD93(5.0,65%), MMRN2(5.1,57%). FLEX: NPDC1(4.8,89%), PECAM1(6.6,85%), VWF(7.3,84%), RAPGEF3(6.0,85%),
      EGFL7(6.6,81%), PTPRB(6.6,79%). Blood endothelial: PECAM1/VWF/AQP1/MMRN2 confirmed all three layers. FLEX adds RAPGEF3/EGFL7/PTPRB
      (endothelial-specific signaling). Triple-concordant.

      '
  '3':
    label: Pericyte
    label_short: PV
    lineage: Pericyte
    confidence: high
    notes: 'Nuclear: ACTA2(6.1,90%), MYLK(6.0,69%), MYH11(6.4,48%), CAV1(2.9,71%), AVPR1A(6.1,37%), PDGFRB(high). Cyto: ACTA2(3.4,91%),
      MYLK(3.7,70%), MYH11(4.3,53%), CAV1(2.1,82%). FLEX: NOTCH3(5.8,77%), MCAM(4.3,80%), TAGLN(3.9,87%), ACTA2(5.4,76%),
      TINAGL1(4.2,79%), CSRP1(3.8,82%). Pericyte: NOTCH3 (pericyte TF, LFC=5.8) and MCAM/CD146 (pericyte surface marker, LFC=4.3)
      are exclusive to c3 in FLEX across all stromal clusters. Xenium panel lacks both NOTCH3 and MCAM — FLEX extends the
      call. Nuclear: PDGFRB + CAV1 present; fibroblast markers (FBLN1, CCDC80, DCN) absent — rules out fibroblast identity.
      Contractile markers (ACTA2/MYH11/MYLK) are shared with smooth muscle but expected in pericytes. Distinguished from smooth
      muscle by FLEX pericyte signature (NOTCH3/MCAM exclusive to c3); smooth muscle emerges as a discrete Xenium-only cluster
      at res=0.5 (c10) lacking the FLEX pericyte signature entirely.

      '
  '4':
    label: Adipocyte
    label_short: Adipo
    lineage: Adipocyte
    confidence: high
    notes: 'Nuclear: ADIPOQ(11.7,90%), ADH1B(8.0,89%), LPL(7.2,84%), SCD(7.2,62%), FASN(6.5,62%). Cyto: ADIPOQ(9.7,97%), ADH1B(7.3,98%),
      LPL(6.9,97%), FASN(6.9,87%), AKR1C1(6.0,91%). FLEX: PLIN1(8.8,99%), PLIN4(8.9,98%), PNPLA2(5.7,98%), GPD1(8.2,96%),
      ADIPOQ(7.8,94%). Definitive adipocyte: ADIPOQ confirmed all three layers. FLEX extends with lipid droplet structural
      proteins (PLIN1/PLIN4) and lipolysis machinery (PNPLA2/GPD1). Triple-concordant.

      '
  '5':
    label: Lymphatic Endothelial
    label_short: LEC
    lineage: Endothelial
    confidence: high
    notes: 'Nuclear: CAVIN2(6.1,74%), MRC1(8.5,63%), CD9(6.1,64%), CCND1(4.6,67%), CAV1(3.1,74%). Cyto: CAVIN2(6.5,89%), CD9(5.7,73%),
      MRC1(5.4,67%), ANGPT2(5.8,54%), RAMP2(3.9,70%). FLEX: FLT4(6.4,84%), TBX1(6.6,82%), DOCK5(5.0,86%), PPFIBP1(3.6,90%),
      KALRN(3.6,85%). FLT4 (VEGFR3) in FLEX is the definitive lymphatic marker. TBX1 is a lymphatic transcription factor.
      Nuclear: MRC1 (LYVE1 pathway, mannose receptor), CAVIN2 (caveolin-related, expressed in lymphatics), ANGPT2 (lymphangiogenesis).
      Triple-concordant. Distinct from blood EC (c2): no VWF/CD93/MMRN2/EGFL7; FLT4 vs PECAM1-dominant.

      '
  '6':
    label: Fibroblast
    label_short: Fb
    lineage: Fibroblast
    confidence: high
    notes: 'Nuclear: FBLN1(3.5,67%), CCDC80(2.8,57%), CXCL12(0.4,63%), MMP2(1.1,44%). Cyto: FBLN1(3.1,85%), CCDC80(2.6,83%),
      MMP2(1.6,76%), CXCL12(1.0,90%). FLEX: COL1A2(3.0,94%), COL1A1(3.0,91%), DCN(2.8,85%), COL3A1(2.6,88%), MMP2(2.5,76%).
      Second fibroblast population: same FBLN1/CCDC80/DCN/COL1A1 identity as c0 but lower LFC vs c0 (these two differ from
      each other, not from other lineages). Consistent with two fibroblast subtypes that partially overlap in marker space.
      Both assigned Fibroblast at L0.5; see fibroblast_detail section for res=0.5 split.

      '
xenium_only:
  resolution: '0.3'
  note: 'FLEX cells absent from c7–c14. Per corrected CPU-neighbor 2x2 marker review (2026-04-20), all clusters show PDCD1+GZMK
    immune contamination: T-cell exhaustion/effector markers (PDCD1=PD-1, GZMK=Granzyme K) in Xenium stromal nuclei indicate
    ambient T-cell RNA capture at the stromal–immune boundary. These clusters carried incorrect labels in earlier annotation
    passes derived from mismatched RAPIDS-neighbor cluster numbering; corrected numbering revealed the immune contamination
    pattern. All c7–c14 are classified as artifacts at L0.5. Smooth muscle and adipocyte cells present in the compartment
    are captured at res=0.5 (Smooth_Muscle c10) or within res=0.3 c3–c4.

    '
  '7':
    label: Immune_artifact
    label_short: Immune_art
    lineage: Artifact
    confidence: high
    notes: PDCD1+GZMK immune contamination. Xenium-only (no FLEX). Ambient T-cell RNA in stromal nucleus.
