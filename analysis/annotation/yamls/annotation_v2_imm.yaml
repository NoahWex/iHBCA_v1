    scoring_signature: null
    notes: "CD8 TEM. GZMK+EOMES+ canonical circulating TEM. EOMES i2=0% (perfectly consistent across studies). Checkpoint\
      \ co-expression present: PD-1 (z=1.68), LAG3 (z=1.83), TIGIT \u2014 chronic antigen exposure history, not terminal exhaustion\
      \ (TIM-3 absent)."
