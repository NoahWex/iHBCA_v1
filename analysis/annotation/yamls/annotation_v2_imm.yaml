    scoring_signature: null
    notes: "Recently TCR-activated T cells. ZNF683 (Hobit) top and most consistent marker (i2=17%). CISH, SCML4, THEMIS all\
      \ i2=0% \u2014 perfectly consistent pan-T activation markers. CISH is a negative regulator of TCR/cytokine signaling\
      \ induced by activation. CD8B LOR=1.01 present. CD4/CD8 lineage ambiguous: Kumar splits 54% CD4-activated / 42% CD8-activated;\
      \ Reed has 173 cells with no coherent plurality (CD8_Trm 36%, CD4_Th 29%). 91% Kumar-dominated cluster. FOXP3=0 (not\
      \ Treg)."
