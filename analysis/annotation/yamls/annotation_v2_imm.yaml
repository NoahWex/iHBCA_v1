    - CD69
    - CXCR6
    - ZNF683
    - NR4A2
    required_gene: null
    identity_markers:
    - CD8A
    - CD8B
    - CCL5
    - KLRC1
    - KLRD1
    - KLRK1
    scoring_signature: null
    notes: "CD8 Trm. Largest T cell cluster (27K cells). Kumar+Reed clean agreement. CD8A/B prominent. NK receptor co-expression:\
      \ NKG2A (KLRC1), CD94 (KLRD1), NKG2D (KLRK1) \u2014 NKG2A+ CD8 Trm phenotype consistent with tissue-resident cytotoxic\
      \ T cells."
