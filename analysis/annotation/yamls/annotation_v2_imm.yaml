    - IL7R
    scoring_signature: null
    notes: "Th17. RORC (ROR\u03B3t) + KLRB1 (CD161) + CCR6 + RORA \u2014 canonical Th17 signature. Kumar CD4-Th (decent support).\
      \ Overrides working label CD4_Th_1."
  IFNg_T:
    mode: cluster
    source_resolution: '1.0'
    source_cluster_ids:
    - c9
    parent_label: null
    lineage: T_ambiguous
    figure_target: fig2
    is_artifact: false
    canonical_markers:
    - IFNG
    required_gene: null
    identity_markers:
    - IFNG
    - CCL5
    - ZNF683
    - CRTAM
    - TBX21
    scoring_signature: null
    notes: "IFN-gamma-producing effector T cells. IFNG z=3.00 (max), TNF z=1.93, LTA z=1.73 \u2014 Th1/Tc1 cytokine triad.\
      \ T-bet (TBX21) present. CD4 vs CD8 lineage unresolved: Kumar calls CD4-TEM (64% of 3,795 Kumar cells); Reed calls CD8_Tc1\
      \ (85% of 2,880 Reed cells). Unique among all T cell clusters: every other T cell cluster has Kumar and Reed agreeing\
      \ on CD4 vs CD8 lineage \u2014 c9 is the sole exception. Interpreted as a converging effector state where Th1 and Tc1\
      \ share the IFNG/TNF/LTA/TBX21 program and are transcriptionally indistinguishable. CD8B z=0.58 (weak positive, diluted\
      \ in mixed population). CD4 mRNA undetectable by scRNA-seq. PD-1 z=0.35, TIM-3 absent \u2014 effector, not exhausted.\
      \ Heat shock artifact (HSPA1A/B, DNAJB1 i2 ~97-99%) from specific studies, not identity signal. DA: enriched in BRCA1\
      \ carriers (brca_status_adj). HCP5 (IFN-gamma-inducible lncRNA) top unmapped signal."
  Treg:
    mode: cluster
    source_resolution: '1.0'
    source_cluster_ids:
    - c10
    parent_label: null
    lineage: Treg
    is_artifact: false
    canonical_markers:
