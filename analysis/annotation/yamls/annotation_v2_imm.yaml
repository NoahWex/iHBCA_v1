    - SLAMF6
    - IL7R
    - DUSP1
    - CD69
    scoring_signature: null
    notes: "Resting CD8+ T cells (2026-04-24: renamed from T_naive after evidence re-analysis). CD8A frac=0.45, CD8B=0.34\
      \ (matches CD8_Tem c3: 0.49/0.28); CD4=0.07 (clearly CD8 lineage). Classic naive markers CCR7/SELL/LEF1/KLF2/S1PR1/MAL\
      \ all below 0.10 \u2014 not truly naive. Resting signature strong: IL7R=0.98, TSC22D3=0.99, FOXP1=0.49, TCF7=0.31. Kumar\
      \ native labels: 51% CD8-Trm / 22% CD4-Th / 19% CD4-Th-like / 1% CD4-naive \u2014 Kumar did not call naive. 91% Kumar\
      \ study-dominance \u2014 interpret with caution. Most consistent with a resting/Tcm-like CD8 population misclassified\
      \ as Trm by Kumar due to marker overlap."
