    - CTLA4
    - IKZF2
    - IKZF4
    - LAYN
    - RTKN2
    - TIGIT
    scoring_signature: null
    notes: "Tregs. FOXP3 LOR=4.47 (dominant). Full canonical panel confirmed: CTLA4, Helios (IKZF2 i2=0%), Eos (IKZF4), LAYN,\
      \ RTKN2 (effector Treg markers), TIGIT, GITR (TNFRSF18). SELL and LEF1 both i2=0% \u2014 resting/central Treg phenotype,\
      \ consistent with Kumar plurality being CD4-naive (2,796) despite 2,236 explicit CD4-Treg calls. CXCL13 LOR=2.08 suggests\
      \ Tfr subset present. Helios+ consistent with thymic Treg origin."
  ZNF683_T:
    mode: cluster
    source_resolution: '1.0'
    source_cluster_ids:
