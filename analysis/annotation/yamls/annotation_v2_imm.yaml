      \ \u2014 misclassified as immune during sorting. 63% Reed, 16% Pal, only 179 Kumar cells. Exclude from immune analysis."
  CD8_Resting:
    mode: cluster
    source_resolution: '1.0'
    source_cluster_ids:
    - c20
    parent_label: null
    lineage: CD8_T
    is_artifact: false
