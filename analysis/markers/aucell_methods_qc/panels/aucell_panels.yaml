# AUCell signature panels — canonical gene lists for Fig 2c + s2.6
#
# Source-of-truth for the 11 signature panels scored by
# publication/analysis/markers/aucell_methods_qc/scripts/build_ihbca_fig2_aucell_scores.py
#
# Schema:
#   panels[i].key                  — internal key (matches script ALL_PANELS tuple[0])
#   panels[i].display              — human-readable name for figure legends
#   panels[i].source.citation      — primary publication
#   panels[i].source.pmid          — PubMed ID (or list for synthesized panels)
#   panels[i].source.doi           — DOI (or list for synthesized panels)
#   panels[i].source.location      — specific table/figure within publication
#   panels[i].source.full_or_subset — "full" if entire source list; "subset" if curated
#   panels[i].source.curation      — null if full; reason + procedure if subset
#   panels[i].source.legacy_key    — (optional) backward-compat key used in earlier drafts
#   panels[i].genes                — gene symbols (HGNC)
#
# Used as canonical input by:
#   - build_ihbca_fig2_aucell_scores.py (TODO: refactor to read from this YAML)
#   - submission/figures/fig2/tables/s_fig2_ihbca_aucell_panels.csv (generated from this)
#   - submission/methods/drafts/M-4c_v1_clinical_da.md (citations in AUCell subsection)
#
# PMID/DOI fields added 2026-05-23 from coordination/drafts/aucell_panel_citations_with_pmids.md
# (8/8 panels resolved via PubMed lookup). Suryadevara authorship corrected from "Suzuki"
# transcription error (DOI 10.1038/s41580-024-00738-8 resolves to Suryadevara et al. 2024
# "SenNet recommendations for detecting senescent cells", Nat Rev Mol Cell Biol 25:1001-1023).

version: 3
last_updated: 2026-05-23

panels:

  # ---------- Tumor-context reference anchors ----------
  # Panels rebuilt 2026-05-23 to use Wu et al. 2020 GitHub stromal_subclasses
  # repo as the authoritative AUCell gene-list source. The Wu lab assembled
  # PDAC iCAF/myCAF reference panels from Öhlund 2017 (mouse) and Elyada 2019
  # (human) — performing mouse-to-human ortholog mapping and AUCell-formatting —
  # and released them at:
  #   https://github.com/sunnyzwu/stromal_subclasses/blob/master/
  #   05_gene_signature_analysis/AUCell/gene_signatures.csv
  #   commit 9c819769bd622c71d67bbdf75a4e1c34cdfa36b6 (2019-11-21)
  # We use these published curated panels directly to ensure that the gene
  # lists scored here match the lists scored in Wu et al. 2020.
  # The prior Wu2020 panel (11 chemokine markers) was removed: those genes
  # represent a cross-paper canonical iCAF marker set (Costa 2018 / Pelon 2020 /
  # Pal 2021 / Zheng 2022) rather than the Wu 2020 iCAF cluster signature,
  # and Wu's own cluster signature (Dataset EV1; 610 iCAF DEGs) is not
  # retrievable from the Springer-deposited supplementary materials (the
  # Dataset EV1 ZIP contains only a README).

  - key: Ohlund2017
    display: "Öhlund 2017 PDAC iCAF (Tuveson curated)"
    source:
      citation: "Öhlund et al. 2017 J Exp Med 214:579-596"
      pmid: 28232471
      doi: "10.1084/jem.20162024"
      location: "39-gene iCAF reference panel curated by the Tuveson lab from Öhlund et al. 2017 mouse PSC-organoid co-culture DESeq2 data, mouse-to-human orthologs mapped by the Tuveson lab. Distributed as the `Tuveson_iCAF_mouse` column of Wu et al. 2020 stromal_subclasses GitHub repo (commit 9c819769bd622c71d67bbdf75a4e1c34cdfa36b6, file 05_gene_signature_analysis/AUCell/gene_signatures.csv)."
      full_or_subset: "full"
      curation: "Used verbatim from the Wu 2020 GitHub `Tuveson_iCAF_mouse` column. Curation performed by the Tuveson lab as part of Öhlund 2017; ortholog mapping performed by the Wu/Tuveson labs for the Wu 2020 manuscript. No further filtering applied in this study."
      ortholog_mapping_note: "Mouse → human symbols mapped by the Tuveson lab in the source CSV. AUCell silently drops genes lacking a human ortholog entry in the iHBCA v1 gene_symbol → Ensembl mapping."
    genes: [CLEC3B, GSN, PTX3, LY6C1, EFEMP1, LY6A, FIGF, TNFAIP6, IFI27L2A, DPT, ADM, PLPP3, TNXB, CXCL12, GSTM1, C4B, OGN, C3, PCOLCE2, CXCL1, COL14A1, SVEP1, ADAMTS5, HP, HAS1, SCARA3, IFI205, DPEP1, SFRP4, PRSS23, ACKR3, HTRA3, APOE, CCL7, IL6, SFRP2, PLA1A, SCARA5, SNED1]

