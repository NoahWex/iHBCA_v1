          Risk: HR (BRCA1 carrier)
          Donor: 0894 (maps to KCF0894 in iHBCA)
          Barcode: AAACCTGAGCAAATCA

        Normal format (4 components):
          Input: N_0123_total_AAACCTGAGAACAATC-1
          Risk: AR (Normal)
          Donor: 0123
          Barcode: AAACCTGAGAACAATC

        iHBCA donor mapping:
          B1_0894 -> KCF0894
          B1_0033 -> MH0033
          B1_0023 -> MH0023
          B1_0090 -> MH0090

# -----------------------------------------------------------------------------
# IMPLEMENTATION NOTES
# -----------------------------------------------------------------------------

implementation_notes:

  barcode_normalization:
    description: |
      All barcodes should be normalized to bare 16bp format (no suffix) for matching.
      However, some studies have 14bp barcodes (older 10x chemistry).

    steps:
      - "Strip -N suffix if present"
      - "Verify remaining string is 14 or 16 characters"
      - "Verify all characters are A, C, G, or T"

    code_example: |
      def normalize_barcode(barcode_with_suffix):
          # Strip -N suffix
          if '-' in barcode_with_suffix:
              barcode = barcode_with_suffix.rsplit('-', 1)[0]
          else:
              barcode = barcode_with_suffix

          # Validate
          if len(barcode) not in [14, 16]:
              raise ValueError(f"Invalid barcode length: {len(barcode)}")
          if not re.match(r'^[ACGT]+$', barcode):
              raise ValueError(f"Invalid barcode characters: {barcode}")

          return barcode

  donor_mapping_strategy:
    description: |
      Cell IDs alone are not sufficient for donor mapping in most studies.
      Must use metadata columns to establish cell_id -> donor_id mapping.

    by_study:
      reed: "donor_id column in metadata"
      kumar: "donor_id column in metadata"
      murrow: "Sample column in metadata"
      twigger: "donor_id column in metadata"
      nee: "patient column in metadata"
      pal_norm_epi: "Extract from cell_id (component 2) or group column"
      pal_norm_total: "Extract from cell_id (component 2) or group column"
      pal_norm_b1: "Extract from cell_id (component 2) or group column"

  cross_study_matching:
    description: |
      To match cells across studies in the iHBCA joint embedding:
      1. Each study has its own cell ID format
      2. iHBCA integration preserves original cell IDs
      3. Use study-specific extraction to get barcodes
      4. Match via iHBCA cell_id index

    warning: |
      Barcodes alone are NOT unique across studies (or even within large studies).
      Full cell_id must be used for matching. The combination of
      (study, donor_id, barcode) provides uniqueness.

