  - id: "kumar-risk-status-clarification"
    description: "Cancer Mastectomy patients have UNKNOWN risk_status"
    notes: |
      10 samples are Cancer Mastectomy (post-cancer patients).
      These patients had cancer but we have NO genotype information.
      Cancer history ≠ BRCA carrier status.
      Resolution: Classify as risk_status = unknown (not HR).
    verify_in: "Track 2 - confirm no BRCA genotype data in RDS metadata"

