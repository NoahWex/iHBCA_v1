# =============================================================================
# CONFIRMED EDGE CASES
# =============================================================================

confirmed:
  - id: "kumar-no-continuous-age"
    category: "metadata_quality"
    severity: "limitation"
    summary: "Only binary age (Y/O) available, no continuous age"
    details: |
      The Kumar study collected age as a binary variable only:
      - Y = Young (<50 years)
      - O = Old (>=50 years)

      This was a deliberate study design choice, not a data collection error.
      No continuous age values exist in the original supplemental data.
    impact:
      - "Cannot perform continuous age regression analyses"
      - "Must use age_binary column for DA testing"
      - "Age cutoff at 50 matches common pre/post menopausal boundary"
    resolution: "Use age_binary (Y/O) for differential abundance tests"
    source: "Supplementary Table 1 legend (KUMAR_table1_extracted.txt)"
    linked_knowledge_entry: "knowledge.md: kumar-no-continuous-age"

  - id: "kumar-incomplete-extraction"
    category: "data_availability"
    severity: "informational"
    summary: "Extracted file contains 102/167 samples"
    details: |
      The extracted KUMAR_table1_extracted.txt contains samples hbca_c66 through hbca_c167.
      The original table legend states 167 tissue samples from 126 women.
      Samples hbca_c01 through hbca_c65 are not in the extracted file.

      PARTIAL EXPLANATION: Some Kumar samples are nuclear-only preparations (different
      processing pipeline). The missing samples may represent nuclear preps vs whole-cell.
      Also note some patients have multiple samples.
    impact:
      - "Track 2 RDS extraction should verify actual sample coverage"
      - "May need to obtain full supplemental table if samples are missing"
      - "Need to determine if nuclear vs whole-cell explains the gap"
    resolution: "Verify against RDS file sample IDs during Track 2; document nuclear vs whole-cell split"
    source: "KUMAR_table1_extracted.txt header vs content"

  - id: "kumar-capitalization-inconsistency"
    category: "data_quality"
    severity: "minor"
    summary: "Inconsistent capitalization in Tissue_Source and BMI_Group columns"
    details: |
      Tissue_Source: "prophylatic Mastectomy" (n=5) vs "Prophylatic Mastectomy" (n=4)
      BMI_Group: "normal" (n=6) vs "Normal" (n=3)

      Also note: "prophylatic" is a typo for "prophylactic"
    impact:
      - "String matching must be case-insensitive"
      - "Normalization required before analysis"
    resolution: "Normalize during harmonization step"
    source: "KUMAR_table1_extracted.txt"

