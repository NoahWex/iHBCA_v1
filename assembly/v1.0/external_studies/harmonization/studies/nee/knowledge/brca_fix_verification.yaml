# Nee BRCA Mislabeling Fix Verification
# Generated: 2026-01-20
# Issue: 8 of 11 Controls mislabeled as HR in iHBCA metadata

issue_id: nee-brca-mislabeling
verification_date: "2026-01-20"
status: VERIFIED

# The native RDS has correct BRCA status in the mutation column
native_rds_labels:
  column_name: mutation
  values:
    BRCA1: "cells with mutation = 'BRCA1'"
    "No Mutation": "cells with mutation = 'No Mutation'"
  # Donor distribution by mutation status (inferred from patient column naming)
  donors_per_status:
    BRCA1:
      count: 11
      patient_ids:
        - BRCA_Ind2
        - BRCA_Ind3
        - BRCA_Ind4
        - CA075_BRCA
        - CA098_BRCA
        - CA165_BRCA
        - CA320_BRCA
        - CA460_BRCA
        - CA818_BRCA
        - CB_699_BRCA
        - CB468_BRCA
    Control:
      count: 11
      patient_ids:
        - Ctrl_Ind1
        - Ctrl_Ind9
        - Ctrl_Ind10
        - CA1140_Ctrl
        - CA275_Ctrl
        - CA278_Ctrl
        - CA287_Ctrl
        - CA639_Ctrl
        - CA719_Ctrl
        - CA843_Ctrl
        - CB375_Ctrl

# Cell ID format analysis
cell_id_encoding:
  encodes_brca: false
  explanation: |
    Cell IDs do NOT follow the expected Ctrl-*/BRCA1-* prefix pattern.
    Instead, they have a complex format like:
      UCI_Patients _BRCA_Ind2_BRCA_Ind2_Epi_AAACATACGCCAAT-1
    The patient/donor name is embedded but parsing is unreliable.

  cell_id_examples:
    brca_donor:
      - "UCI_Patients _BRCA_Ind2_BRCA_Ind2_Epi_AAACATACGCCAAT-1"
      - "CA075_BRCA (embedded in cell ID)"
    control_donor:
      - "Ctrl_Ind1_Epi (from orig.ident)"
      - "CA1140_Ctrl (embedded in cell ID)"

  prefix_parse_results:
    ctrl_count: 0
    brca1_count: 0
    other_count: 230100
    parse_success_rate: 0.0%

# Recommended mapping approach
mapping_rule:
  source_column: mutation
  target_column: risk_status_binary
  transformation: |
    # Direct mapping from mutation column - NO PARSING NEEDED
    risk_status_binary <- case_when(
      mutation == "BRCA1" ~ "HR",
      mutation == "No Mutation" ~ "AR",
      TRUE ~ NA_character_
    )

    # Alternative: derive from patient column naming pattern
    # (as backup verification)
    risk_from_patient <- case_when(
      grepl("BRCA|brca", patient, ignore.case = FALSE) ~ "HR",
      grepl("Ctrl|ctrl", patient, ignore.case = FALSE) ~ "AR",
      TRUE ~ NA_character_
    )

# Verification checks
verification_checks:
  - check: "11 BRCA1 donors in patient column"
    result: PASS
    actual: 11
    expected: 11
    method: "Count unique patients matching pattern BRCA|_BRCA"

  - check: "11 Control donors in patient column"
    result: PASS
    actual: 11
    expected: 11
    method: "Count unique patients matching pattern Ctrl|_Ctrl"

  - check: "mutation column has exactly 2 values"
    result: PASS
    actual: 2
    expected: 2
    values: ["BRCA1", "No Mutation"]

  - check: "mutation column has no missing values"
    result: PASS
    n_missing: 0
    total_cells: 230100

  - check: "Total 22 unique donors"
    result: PASS
    actual: 22
    expected: 22

# Why original knowledge.md was partially wrong
discrepancy_explanation: |
  The knowledge.md stated: "Extract risk_status from cell ID pattern (Ctrl vs BRCA1 prefix)"

  This was INCORRECT because:
  1. Cell IDs do NOT follow "Ctrl-*" or "BRCA1-*" prefix pattern
  2. Cell IDs have a complex format: {cohort}_{patient}_{tissue_type}_{barcode}
  3. The prefix parsing in raw_data_extraction.yaml found 0% coverage

  The CORRECT approach is to use the `mutation` column directly:
  - mutation = "BRCA1" -> risk_status = "HR"
  - mutation = "No Mutation" -> risk_status = "AR"

  This column has 100% coverage (no missing values) and correctly identifies
  all 22 donors (11 BRCA1 + 11 Control).

# Harmonization recommendation
recommendation: |
  1. Use the `mutation` metadata column as the authoritative source for BRCA status

  2. Apply mapping in harmonization:
     - mutation = "BRCA1" -> risk_status_binary = "HR"
     - mutation = "No Mutation" -> risk_status_binary = "AR"

  3. Verify against patient column naming as sanity check:
     - Patients with "BRCA" in name should have mutation = "BRCA1"
     - Patients with "Ctrl" in name should have mutation = "No Mutation"

  4. Do NOT rely on cell ID prefix parsing (0% success rate)

  5. Update knowledge.md to reflect that `mutation` column (not cell ID)
     is the source of truth

# Evidence that iHBCA mislabeling occurred upstream
ihbca_mislabeling_evidence: |
  The knowledge.md states: "8 of 11 Controls labeled as HR in iHBCA metadata"

  Root cause: The iHBCA integration process likely used a different metadata
  source or had a mapping error that assigned most Controls as HR.

  The native Nee RDS (direct from authors) has correct labels in the
  `mutation` column, confirming this was an upstream integration error.
