open_questions:

  cell_id_format_verification:
    question: "Does the cell ID prefix pattern (Ctrl-* vs BRCA1-*) hold for ALL 230,100 cells?"
    context: |
      Knowledge.md documents that cell IDs encode BRCA status via prefix.
      This is the basis for fixing the BRCA mislabeling issue.
      MUST verify:
      - ALL cell IDs start with either Ctrl- or BRCA1-
      - No other patterns exist
      - Count cells per prefix matches expected (11 AR donors, 11 HR donors)
    resolve_by: "Track 2 - pattern analysis on colnames(obj)"
    status: OPEN

  cell_id_full_format:
    question: "What is the complete cell ID format beyond the prefix?"
    context: |
      Examples from knowledge.md:
      - "Ctrl-WD37026_AACTCCCGTCGCATAT"
      - "BRCA1-M1161181A_ACGGGTCTCAATCTGT"

      Appears to be: {brca_prefix}-{patient_id}_{barcode}

      MUST discover through UNSUPERVISED analysis:
      - Identify all separators
      - Count components
      - Verify barcode is 16bp ACGT
      - Determine if patient_id matches Table 1 Patient ID column
    resolve_by: "Track 2 - unsupervised pattern analysis"
    status: OPEN

  patient_id_to_cell_mapping:
    question: "How do Table 1 Patient IDs map to cell ID components?"
    context: |
      Table 1 Patient IDs include aliases: "CA278 / C017L", "CA818 / CE_97 / C078SCR"
      Cell IDs appear to use one of these IDs (e.g., "Ctrl-WD37026")

      Need to verify:
      - Which Patient ID variant appears in cell IDs
      - Do "(indN)" suffixes appear in cell IDs?
      - Can we reliably map cells to donors via this component?
    resolve_by: "Track 2 - cross-reference Patient ID variants with cell ID components"
    status: OPEN

  metadata_column_mapping:
    question: "How do supplemental Table 1 columns map to RDS @meta.data?"
    context: |
      Supplemental has: Patient No., Patient ID, Age, Ancestry, Number of Cells,
      BRCA1 Mutation, Chemo, Radiation, Hormone Therapy, BMI, Co-Morbidities,
      Cancer History, Diagnosis, Application, Tissue Source, Menstrual Status,
      Parity, Age at Menarche, Age of first birth, Family History

      RDS column names may differ. Need explicit mapping table.
    resolve_by: "Track 2 - colnames(obj@meta.data) comparison"
    status: OPEN

  parity_format_parsing:
    question: "How should the GPMA parity format be parsed for DA testing?"
    context: |
      Parity uses obstetric notation: G3P2M1A0
      - G = Gravida (total pregnancies)
      - P = Para (live births)
      - M = Miscarriages
      - A = Abortions

      For parity_binary: P > 0 = parous, P = 0 = nulliparous

      Need to verify:
      - Same format in RDS?
      - Coverage in RDS metadata?
      - 4 donors have explicit "G0P0M0A0" (nulliparous)
    resolve_by: "Track 2 - verify parity column exists and parse"
    status: OPEN

  age_as_testable_condition:
    question: "Confirm age range enables age_binary testing"
    context: |
      Table 1 ages for scRNAseq samples: 18-71 (one "-" value)
      Good contrast expected for age_binary (cutoff typically 50)

      Need to verify:
      - Age present in RDS metadata
      - Distribution above/below cutoff
      - Handle the 1 missing age value
    resolve_by: "Track 2 - verify age column and distribution"
    status: OPEN

  cell_distribution:
    question: "How do 230,100 cells distribute across 22 donors?"
    context: |
      Table 1 has Number of Cells column for each scRNAseq donor.
      Range: 3,779 (CA843) to 21,051 (WD58673)
      Need to verify these counts match RDS.
    resolve_by: "Track 2 - table(obj$donor_column)"
    status: OPEN

# -----------------------------------------------------------------------------
# NOTES
# -----------------------------------------------------------------------------
notes: |
  ## Summary

  Nee study has one major issue (BRCA mislabeling) that requires correction.
  The fix is straightforward because cell IDs encode BRCA status.

  ## Key Points for Implementation

  1. **BRCA status from cell ID**: Extract from prefix (Ctrl- vs BRCA1-)
  2. **Ignore iHBCA risk_status**: Use cell ID-derived status instead
  3. **No menopausal testing**: Insufficient data
  4. **Patient ID aliases**: May need flexible matching

  ## Expected After Fix

  - 11 AR donors: Ctrl-* cell IDs
  - 11 HR donors: BRCA1-* cell IDs
  - Total: 230,100 cells
  - Testable conditions: age_binary, parity, risk_status (fixed)

  ## Reference

  - Supplemental extraction: `../extracted/supplemental_extraction.yaml`
  - Source of truth: NEE_41588_2023_1298_MOESM4_ESM.xlsx, Table 1
  - Knowledge base: `.claude/rules/integration-assessment/knowledge.md`
