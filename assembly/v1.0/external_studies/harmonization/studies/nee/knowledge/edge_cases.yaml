    discovered: "Supplemental extraction 2026-01-20"

    description: |
      Only 2 donors have explicit menopausal status recorded in supplemental
      data. Most scRNAseq samples have "-" (no data) for Menstrual Status.

    affected_cells:
      count: null  # Most of 230,100 cells
      fraction: null  # ~90% missing menopausal data
      donors: "20 of 22 scRNAseq donors"

    root_cause: |
      Original study did not systematically collect menopausal status for
      all donors. The 2 donors with data are:
      - "Menopausal - Age 47"
      - "Menopausal - Age 39"

    resolution: |
      Menopausal status is NOT testable for Nee study.
      Do not include menopausal_status in DA tests for this study.

    verification: |
      Confirm that Nee is excluded from menopausal_status DA testing.

  # ---------------------------------------------------------------------------
  # NEE_PATIENT_ID_ALIASES - INFORMATIONAL
  # ---------------------------------------------------------------------------
  - id: NEE_PATIENT_ID_ALIASES
    severity: LOW
    status: DOCUMENTED
    discovered: "Supplemental extraction 2026-01-20"

    description: |
      Several donors have multiple ID aliases in the Patient ID column,
      separated by " / ". This may complicate donor matching if different
      IDs are used in different data sources.

    examples:
      - "CA278 / C017L"
      - "CA287 / C019CDR"
      - "CA639 / C051CDR"
      - "CA075 / C002SCR"
      - "CA818 / CE_97 / C078SCR"  # 3 aliases

    resolution: |
      When matching donors:
      1. First try exact match
      2. If no match, try matching any alias (split by " / ")
      3. Document which alias was used for the match

    notes: |
      The "(indN)" suffix in some IDs (e.g., "WD37026 (ind1)") indicates
      an internal study identifier. May need special handling.

