edge_cases:
  # ---------------------------------------------------------------------------
  # NEE_BRCA_MISLABELING - OPEN (requires fix)
  # ---------------------------------------------------------------------------
  - id: NEE_BRCA_MISLABELING
    severity: HIGH
    status: OPEN
    discovered: "Prior knowledge (knowledge.md)"
    confirmed_date: 2026-01-20

    description: |
      8 of 11 Control donors are mislabeled as HR (High Risk) in iHBCA metadata.
      The original Nee study has 11 Controls + 11 BRCA1 carriers, but iHBCA
      metadata shows 3 AR + 19 HR.

    affected_cells:
      count: null  # To be determined from Track 2
      fraction: null  # Approximately 8/22 donors * their cells
      donors:
        expected_ar:
          - "Ctrl-* prefix donors (11 total)"
        incorrectly_labeled_hr:
          - "8 of 11 Controls"
        notes: "Specific donor mapping requires cell ID extraction"

    root_cause: |
      Upstream iHBCA integration error. The original Nee study clearly separates
      "Non-Carrier" (Control) from "BRCA1+/mut" (BRCA1 carrier) in supplemental
      Table 1. However, during iHBCA integration, 8 Controls were misassigned
      as HR.

      The cell ID format in Nee preserves BRCA status in the prefix:
      - "Ctrl-*" = Control (should be AR)
      - "BRCA1-*" = BRCA1 carrier (should be HR)

      This allows independent verification and correction.

    resolution: |
      Extract risk_status from cell ID pattern instead of using iHBCA metadata:

      ```r
      nee_cells$risk_status_fixed <- case_when(
        grepl("^Ctrl-", nee_cells$cell_id) ~ "AR",
        grepl("^BRCA1-", nee_cells$cell_id) ~ "HR",
        TRUE ~ NA_character_
      )
      ```

      Expected result after fix:
      - 11 AR donors (Non-Carrier 1-11)
      - 11 HR donors (BRCA1+/mut 1-11)

    verification: |
      After applying fix:
      1. Count unique donors per risk_status
         - AR: should be 11
         - HR: should be 11
      2. Verify cell counts match supplemental Table 1
      3. Cross-reference donor IDs with supplemental mapping

    evidence:
      supplemental_table_1: |
        Table 1 in NEE_41588_2023_1298_MOESM4_ESM.xlsx shows:
        - Rows 1-11 for scRNAseq are "Non-Carrier N"
        - Rows following are "BRCA1+/mut N"
        - "Patient No." column is definitive source of BRCA status

      ihbca_reported: |
        According to knowledge.md, iHBCA metadata shows:
        - AR: 3 donors
        - HR: 19 donors

      discrepancy: |
        8 donors (11 - 3) are misclassified
        This is consistent with "8 of 11 Controls labeled as HR"

  # ---------------------------------------------------------------------------
  # NEE_CELL_ID_FORMAT - INFORMATIONAL
  # ---------------------------------------------------------------------------
  - id: NEE_CELL_ID_FORMAT
    severity: LOW
    status: DOCUMENTED
    discovered: "Supplemental extraction 2026-01-20"

    description: |
      Nee cell IDs encode BRCA status in a prefix, which is unusual among
      iHBCA component studies. This is actually beneficial as it provides
      a ground truth for BRCA status independent of metadata.

    cell_id_pattern:
      format: "{brca_prefix}-{donor_info}_{barcode}"
      examples:
        - "Ctrl-WD37026_AACTCCCGTCGCATAT"
        - "BRCA1-M1161181A_ACGGGTCTCAATCTGT"
      prefixes:
        "Ctrl-": "Control / Non-Carrier / AR"
        "BRCA1-": "BRCA1 carrier / HR"

    notes: |
      This pattern allows:
      1. Independent verification of BRCA status
      2. Fix for iHBCA mislabeling issue
      3. Donor extraction from cell ID

      Needs verification in Track 2 to confirm exact format.

