# =============================================================================
# RESOLUTION STATUS
# =============================================================================

resolution_status: |
  ACCEPTABLE - Document and proceed.

  The ~12-14% unmatched cell rate is explained by different QC filtering criteria
  between the original Pal 2021 analysis and the iHBCA integration by Reed et al.
  This is NOT an error but rather a consequence of methodological differences.

  Key points:
  1. Root cause is well understood (sample-specific vs unified QC thresholds)
  2. NormB1 100% match confirms our mapping methodology is correct
  3. Unmatched cells can still be analyzed in native embedding
  4. Only matched cells participate in joint embedding analysis
  5. This is consistent with expected behavior when combining datasets processed
     with different QC criteria

# =============================================================================
# RECOMMENDATION
# =============================================================================

recommendation: |
  For DA analysis in the Integration Assessment framework:

  1. NATIVE EMBEDDING ANALYSIS:
     - Use ALL cells from native Pal objects (53,716 NormEpi / 54,332 NormTotal)
     - Unmatched cells do not affect native embedding analysis
     - This preserves the original study's complete data

  2. JOINT EMBEDDING ANALYSIS:
     - Use only MATCHED cells (46,021 NormEpi / 47,892 NormTotal)
     - Unmatched cells cannot be projected into joint space
     - Canonical DA results based on matched subset only

  3. VERIFICATION CHECK (recommended):
     - Verify unmatched cells are evenly distributed across:
       * Donors (not concentrated in specific samples)
       * Menopausal groups (no bias toward pre/post)
     - If distribution is uneven, document but do not exclude

  4. REPORTING:
     - Always report match rates when presenting results
     - Note that ~12-14% of cells are excluded from joint analysis
     - This is standard for cross-study integration work

# =============================================================================
# OPEN QUESTIONS RESOLVED
# =============================================================================

questions_resolved:
  - question: "cell_id_type_field (from edge_cases.yaml)"
    answer: "Type field is 'total' in NormTotal, not 'mix' as previously suspected"

  - question: "cell_count_verification (from edge_cases.yaml)"
    answer: "Confirmed 53,716 cells in NormEpi, 54,332 cells in NormTotal"

  - question: "Why is unmatched rate different between NormEpi (14.3%) and NormTotal (11.9%)?"
    answer: |
      Likely due to cell type composition. NormEpi is epithelial-enriched while
      NormTotal includes all cell types. Different cell populations may have
      different survival rates under the two QC schemes.

