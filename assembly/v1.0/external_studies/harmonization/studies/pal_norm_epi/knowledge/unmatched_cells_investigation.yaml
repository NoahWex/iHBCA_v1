# =============================================================================
# HYPOTHESIZED CAUSES
# =============================================================================

hypothesized_causes:
  - cause: "Different QC filtering criteria between Pal native and iHBCA"
    evidence:
      - "Pal 2021 used sample-specific QC thresholds from SampleStats.txt"
      - "Script reference: Pal_NormEpi.R lines 44-61"
      - "Pal thresholds: mito_upper, nGenes_lower, nGenes_upper, lib_upper per sample"
      - "iHBCA (Reed et al.) applied unified QC criteria across all integrated studies"
      - "Cell sets are subsets, not identical - some cells pass one QC but not the other"
    confidence: high
    supporting_observation: |
      The original Pal_NormEpi.R script explicitly reads sample-specific thresholds:
        SampleStats <- read.delim("../Data/SampleStats.txt")
        mito_upper <- SampleStats$Mito
        nGenes_lower <- SampleStats$GeneLower
        nGenes_upper <- SampleStats$GeneUpper
        lib_upper <- SampleStats$LibSize
      These per-sample thresholds differ from the unified criteria used during iHBCA integration.

  - cause: "Two-pass integration workflow creates unique cell subsets"
    evidence:
      - "NormEpi script creates NormEpiSub by removing stroma clusters (1,2,3)"
      - "Script reference: Pal_NormEpi.R lines 196-311"
      - "Two-pass integration means some cells may be retained/removed differently"
    confidence: medium
    supporting_observation: |
      The Pal workflow performed integration twice - first full dataset, then epithelial
      subset. This two-pass approach may create different cell retention than iHBCA's
      single-pass integration.

  - cause: "Cell type composition differences between NormEpi vs NormTotal"
    evidence:
      - "NormEpi is epithelial-enriched (-epi suffix)"
      - "NormTotal includes all cell types (-total suffix)"
      - "Different cell type compositions may have different QC survival rates"
      - "NormTotal has slightly lower unmatched rate (11.85% vs 14.33%)"
    confidence: medium
    note: "May explain small rate difference between the two substudies"

  - cause: "NormB1 100% match suggests systematic difference in normal samples"
    evidence:
      - "NormB1 (BRCA1 carriers) has 100% match rate"
      - "NormEpi and NormTotal (normal donors) have 12-14% unmatched"
      - "B1 samples may have been processed with different/stricter original QC"
    confidence: low
    note: "Alternative hypothesis - needs verification of B1 sample processing"

