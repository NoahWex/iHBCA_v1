# =============================================================================
# REED-SPECIFIC EDGE CASES
# =============================================================================

edge_cases:

  identity_mapping:
    description: "Reed cell IDs are already in iHBCA format"
    action: "Use identity mapping - no transformation needed"
    notes: |
      Reed IS the iHBCA reference, so cell IDs don't need transformation.
      This is different from other studies which need mapping.

  sample_vs_donor:
    description: "Multiple samples per donor"
    observation: "161 samples from 58 donors (avg 2.8 samples/donor)"
    action: "Use donor_id for biological replicates, not sample_id"
    notes: |
      Sample types include: Organoid unsorted, Supernatant unsorted,
      Organoid LP sorted, spike-in, Supernatant live-sorted.
      DA analysis should be at donor level.

  contralateral_exclusion:
    description: "Contralateral mastectomy donors may have prior cancer treatment"
    affected_donors: 6
    affected_samples: 11
    recommendation: "Consider excluding from some DA analyses"
    notes: |
      These donors had cancer in the opposite breast and may have had
      chemotherapy or other treatments that affect tissue biology.

  assume_wt_interpretation:
    description: "assume_WT vs WT distinction"
    observation: "68 samples have assume_WT, only 6 have tested WT"
    action: "Group assume_WT with WT for control group"
    notes: |
      Reduction mammoplasty patients are not routinely tested for BRCA.
      For population-level analysis, they represent average risk.

  missing_menopause:
    description: "High rate of missing menopausal status"
    observation: "35% missing (57/161 samples), ~31% at donor level"
    action: "Exclude missing from menopause DA analysis"
    notes: |
      Menopausal status loaded from REED_Supplementary_Table_1.csv (Menopause_status column).
      Aggregated from sample-level (161 rows) to donor-level (55 donors) using first non-null.
      Many PM patients do not have recorded menopausal status.
      This may introduce bias if missingness is non-random.
      Values mapped: Pre -> pre, Post/Peri/Post/Post_(surgically_induced) -> post.

  age_from_ihbca:
    description: "Reed age sourced from ihbca_age column"
    observation: "All 55 donors have age in iHBCA unified metadata"
    action: "Use ihbca_age for continuous age; derive binary from cutoff=50"
    notes: |
      Reed was previously excluded from age harmonization despite having
      ihbca_age available for all donors. Fixed to include in col_map.

# =============================================================================
# HARMONIZATION RULES FOR OTHER STUDIES
# =============================================================================

harmonization_rules:

  to_ar_hr_binary:
    description: "Map any risk status to AR/HR binary"
    rules:
      - "Average Risk" -> "AR"
      - "Control" -> "AR"
      - "Normal" -> "AR"
      - "Healthy" -> "AR"
      - "High Risk" -> "HR"
      - "BRCA1" -> "HR"
      - "BRCA2" -> "HR"
      - "Carrier" -> "HR"

  to_age_binary:
    description: "Map continuous age to binary"
    threshold: 50
    rules:
      - "age < 50" -> "Y" (Young)
      - "age >= 50" -> "O" (Old)

  to_parity_binary:
    description: "Map parity to binary"
    rules:
      - "0" -> "nulliparous"
      - ">=1" -> "parous"

  to_menopause_binary:
    description: "Map menopause status to binary"
    rules:
      - "Pre" -> "pre"
      - "Post" -> "post"
      - "Surgical" -> "post"
      - "Peri" -> "exclude or post"

# =============================================================================
# OPEN QUESTIONS FOR TRACK 2
# =============================================================================
# Reed is unique as the canonical reference - fewer open questions than other studies

open_questions:

  cell_id_format:
    question: "What is the exact cell ID format in reed.rds?"
    context: |
      Reed defines the canonical cell ID format for iHBCA.
      Track 2 should document this format explicitly so other studies
      can be mapped to it.

      Expected format components:
      - donor_id (Donor_N format)
      - sample_type
      - barcode

      UNSUPERVISED pattern analysis required.
    resolve_by: "Track 2 - pattern analysis on colnames(obj)"
    status: OPEN

  metadata_column_verification:
    question: "Do RDS @meta.data columns match Supplementary Table 1?"
    context: |
      Supplementary Table 1 has 36 columns of sample/donor metadata.
      RDS may have subset or different column names.
      Need explicit mapping for Track 2.
    resolve_by: "Track 2 - colnames(obj@meta.data) comparison"
    status: OPEN

  cell_count_verification:
    question: "Confirm total cell count is 803,283"
    context: |
      knowledge.md lists 803,283 cells for Reed.
      Verify this matches ncol(reed.rds).
    resolve_by: "Track 2 - ncol(obj)"
    status: OPEN

  cell_distribution:
    question: "How do 803,283 cells distribute across 58 donors?"
    context: |
      58 donors with multiple samples each.
      Need per-donor cell counts for understanding
      potential imbalances in DA testing.
    resolve_by: "Track 2 - table(obj$donor_column)"
    status: OPEN

  sample_type_in_rds:
    question: "Is sample_type (Organoid/Supernatant/etc) preserved in RDS?"
    context: |
      Supplementary Table 1 shows:
      - Organoid unsorted (63)
      - Supernatant unsorted (57)
      - Organoid LP sorted (39)
      - spike-in (1)
      - Supernatant live-sorted (1)

      These represent different cell fractions. Need to verify
      if this distinction is preserved in RDS metadata.
    resolve_by: "Track 2 - check for sample_type column"
    status: OPEN
