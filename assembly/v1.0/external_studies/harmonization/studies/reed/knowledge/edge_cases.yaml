# =============================================================================
# REED STUDY - EDGE CASES AND CANONICAL SCHEMA DEFINITIONS
# =============================================================================
# Reed et al. 2024 is the iHBCA reference atlas paper.
# This file documents the CANONICAL schemas that other studies should map to.
# =============================================================================

study: reed
last_updated: 2026-01-20

# =============================================================================
# CANONICAL METADATA SCHEMA
# =============================================================================
# These are the ground truth values for metadata harmonization.
# All other studies should map their metadata TO these values.
# =============================================================================

canonical_schema:

  # ---------------------------------------------------------------------------
  # Risk Status
  # ---------------------------------------------------------------------------
  risk_status:
    description: "Binary or categorical risk classification for breast cancer"
    canonical_values:
      AR:
        meaning: "Average Risk"
        criteria: "Reduction mammoplasty patients without known BRCA mutations"
        typical_surgery: "reduction_mammoplasty"
      HR-BR1:
        meaning: "High Risk - BRCA1 carrier"
        criteria: "Confirmed pathogenic BRCA1 mutation"
        typical_surgery: "prophylactic_mastectomy"
      HR-BR2:
        meaning: "High Risk - BRCA2 carrier"
        criteria: "Confirmed pathogenic BRCA2 mutation"
        typical_surgery: "prophylactic_mastectomy"
      HR-unk:
        meaning: "High Risk - unknown mutation"
        criteria: "Prophylactic mastectomy but mutation status unknown"
        typical_surgery: "prophylactic_mastectomy"
      Contralateral-BR1:
        meaning: "Contralateral mastectomy in BRCA1 carrier"
        criteria: "BRCA1 carrier with history of breast cancer in opposite breast"
        typical_surgery: "contralateral"

    binary_mapping:
      AR: "AR"
      HR-BR1: "HR"
      HR-BR2: "HR"
      HR-unk: "HR"
      Contralateral-BR1: "HR"

    notes: |
      For binary DA analysis, map all HR variants to "HR".
      AR (Average Risk) is the reference group for DA comparisons.
      Contralateral may be excluded from some analyses due to prior cancer history.

  # ---------------------------------------------------------------------------
  # BRCA Status
  # ---------------------------------------------------------------------------
  brca_status:
    description: "BRCA1/2 mutation status"
    canonical_values:
      WT:
        meaning: "Wild type, tested negative"
        criteria: "Genetic testing confirmed no pathogenic BRCA mutations"
      assume_WT:
        meaning: "Assumed wild type, untested"
        criteria: "Reduction mammoplasty patients not tested for BRCA"
        notes: "These are healthy controls - RM patients are assumed WT"
      BRCA1:
        meaning: "Pathogenic BRCA1 mutation"
        criteria: "Confirmed pathogenic variant in BRCA1 gene"
      BRCA2:
        meaning: "Pathogenic BRCA2 mutation"
        criteria: "Confirmed pathogenic variant in BRCA2 gene"
      unknown:
        meaning: "Status not determined"
        criteria: "Testing not performed or inconclusive"

    notes: |
      For BRCA-specific DA analysis, use BRCA1 vs AR or BRCA2 vs AR.
      assume_WT donors should be grouped with WT for control group.

  # ---------------------------------------------------------------------------
  # Surgery Type
  # ---------------------------------------------------------------------------
  surgery_type:
    description: "Type of surgery from which tissue was obtained"
    canonical_values:
      reduction_mammoplasty:
        meaning: "Healthy tissue reduction"
        abbreviation: "RM"
        typical_risk: "AR"
        notes: "Healthy volunteers reducing breast size"
      prophylactic_mastectomy:
        meaning: "Preventive removal"
        abbreviation: "PM"
        typical_risk: "HR"
        notes: "BRCA carriers removing healthy tissue preventively"
      contralateral:
        meaning: "Mastectomy of opposite breast after cancer"
        typical_risk: "HR"
        notes: "May have treatment history, use with caution"

    mapping_from_other_studies:
      reductive_mammoplasty: "reduction_mammoplasty"
      rm: "reduction_mammoplasty"
      RM: "reduction_mammoplasty"
      prophylactic: "prophylactic_mastectomy"
      pm: "prophylactic_mastectomy"
      PM: "prophylactic_mastectomy"

  # ---------------------------------------------------------------------------
  # Menopause Status
  # ---------------------------------------------------------------------------
  menopause_status:
    description: "Menopausal status at time of surgery"
    canonical_values:
      Pre:
        meaning: "Premenopausal"
        criteria: "Active menstrual cycles"
      Post:
        meaning: "Natural postmenopausal"
        criteria: "Natural cessation of menstrual cycles (typically age >50)"
      Post_(surgically_induced):
        meaning: "Surgical menopause"
        criteria: "Menopause induced by oophorectomy"
        notes: "Common in BRCA carriers who undergo risk-reducing surgery"
      Peri/Post:
        meaning: "Perimenopausal transitioning to post"
        criteria: "Transitional period between pre and post"

    binary_mapping:
      Pre: "pre"
      Post: "post"
      Post_(surgically_induced): "post"
      Peri/Post: "post"

    mapping_from_other_studies:
      Premenopausal: "Pre"
      premenopausal: "Pre"
      pre: "Pre"
      Postmenopausal: "Post"
      postmenopausal: "Post"
      post: "Post"
      Surgical_menopause: "Post_(surgically_induced)"

  # ---------------------------------------------------------------------------
  # Parity
  # ---------------------------------------------------------------------------
  parity:
    description: "Number of births/pregnancies carried to term"
    canonical_values:
      - "0"  # nulliparous
      - "1"
      - "2"
      - "3"
      - "4"
      - "unknown"

    binary_mapping:
      "0": "nulliparous"
      "1": "parous"
      "2": "parous"
      "3": "parous"
      "4": "parous"
      "unknown": null  # exclude from binary analysis

  # ---------------------------------------------------------------------------
  # Age
  # ---------------------------------------------------------------------------
  age:
    description: "Donor age at time of surgery"
    continuous: true
    binary_threshold: 50
    binary_mapping:
      under_50: "Y"  # Young
      over_50: "O"   # Old

# =============================================================================
