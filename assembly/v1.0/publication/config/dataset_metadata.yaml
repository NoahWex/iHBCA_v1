# =============================================================================
# CELL RANGER → GENCODE MAPPING REFERENCE
# =============================================================================
# For filling alignment_software / gene_annotation_version when CR versions
# are recovered from Austin Reed handoff or publication supplements:
#
#   CR 3.x   → GRCh38-1.2.0  → GENCODE v24 / Ensembl 87
#   CR 5.x   → GRCh38-2020-A → GENCODE v32 / Ensembl 98
#   CR 6.x   → GRCh38-2020-A → GENCODE v32 / Ensembl 98
#   CR 7.x   → GRCh38-2020-A → GENCODE v32 / Ensembl 98
#   CR 7.1+  → GRCh38-2024-A → GENCODE v44 / Ensembl 113
# =============================================================================
