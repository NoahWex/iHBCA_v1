      total_missing: 97
    - field: development_stage_ontology_term_id
      description: "Kumar has NO continuous age for 126 donors (binary only). All other studies have continuous age."
      total_affected: 126
    - field: gene_annotation_version
      description: "Resolved for Lawson (GENCODE v32 / Ensembl 98 via Cell Ranger 7.1.0). Extractable from publication Methods sections for 7 external studies (Cell Ranger version → 10x reference release notes → GENCODE/Ensembl version)."
      total_affected: 7
    - field: cell_type_ontology_term_id
      description: "All studies have labels but none are CL ontology terms. Requires mapping table."
      total_affected: 8

  sequencing_metadata_gap:
    description: "library_id, library_prep_batch, library_seq_run, alignment_software, sample_preservation_method missing for ALL studies"
    action: "Consolidated outreach to Austin Reed (external) and Dawson lab core (native)"
    note: "These are Tracker fields, not obs fields — may not block validator but block submission"

  hardcodable_count: 7
  needs_mapping_count: 5
  truly_missing_count: 8
