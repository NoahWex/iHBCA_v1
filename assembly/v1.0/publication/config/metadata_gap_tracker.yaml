# =============================================================================
# HCA TIER 1 METADATA GAP TRACKER
# =============================================================================
# Per-study × per-field gap status for HCA Atlas Ingestion.
# Source: Gap assessment (2026-02-11) against hca_atlas_ingestion.yaml schema
#         + harmonized_donor_metadata.csv (287 donors × 24 columns)
#
# Status values:
#   complete       - Value present and correct for all donors/cells
#   partial        - Present for some donors, missing for others
#   missing        - Not present in any current object
#   hardcodable    - Same value for all cells, can be set programmatically
#   needs_mapping  - Value exists but needs ontology term mapping
#   in_outreach    - Actively requesting from external contacts
#   not_applicable - Field does not apply to this study
#
# Updated: 2026-02-11
# =============================================================================
# It's metadata all the way down.

version: "1.0"

# ---------------------------------------------------------------------------
# CONSTANT FIELDS — identical across all studies
# ---------------------------------------------------------------------------
# These can be hardcoded in any packaging script.
constant_fields:
  organism_ontology_term_id:
    value: "NCBITaxon:9606"
    note: "Homo sapiens — all studies are human"
  tissue_ontology_term_id:
    value: "UBERON:0000310"
    note: "breast — all studies sample breast tissue"
  sex_ontology_term_id:
    value: "PATO:0000383"
    note: "female — all donors are female"
  disease_ontology_term_id:
    value: "PATO:0000461"
    note: "normal — healthy tissue atlas. BRCA carriers without active cancer are still 'normal' per HCA conventions"
  is_primary_data:
    value: true
    note: "All source datasets contain original observations"
  suspension_type:
    value: "cell"
    note: "All Chromium studies used cell suspensions. Xenium is NA (in situ)."
    xenium_override: "na"

