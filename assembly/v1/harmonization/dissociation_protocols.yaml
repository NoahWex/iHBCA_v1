# dissociation_protocols.yaml
# Per-study dissociation protocol reference for iHBCA v1.0 (7 studies)
#
# This file is NOT derived from the iHBCAv1 uploaded object.
# It is curated from each study's published methods section.
# Kumar per-donor assignments are derived from per-cell metadata
# (iHBCAv1_upload/external_studies/harmonization/outputs/study_objects/kumar/metadata.csv,
#  column: suspension_dissociation_time, grouped by ihbca_donor_id mode).
#
# This file populates the dissociation_minutes column in harmonized_donor_metadata.csv.
# Source: build_harmonized_donors.py uses _KUMAR_DISSOC_MINUTES dict derived from this file.
#
# Key finding: Kumar is the ONLY within-study heterogeneous protocol.
# All other studies use a single consistent protocol per study,
# so dissociation time is absorbed by the study covariate for those cohorts.
# Kumar's three protocols were INTENTIONAL study design to assess protocol bias.

version: "1.0"
created: "2026-05-04"
studies:

  reed:
    paper: "Reed et al. (2024) Nat Genet 56:652-662"
    doi: "10.1038/s41588-024-01688-9"
    pmid: "38548988"
    protocol_class: enzymatic_short
    reagents: "0.025% Trypsin + 0.4 mg/ml DNase I"
    temperature_c: 37
    minutes_typical: 5
    minutes_max: 10
    consistent_within_study: true
    note: >
      Frozen epithelial-enriched or stromal-enriched fractions thawed and incubated at 37C
      with pipetting every 2-3 min until smoothly digested, up to 10 min maximum.
      Actual times recorded per-donor (5/7/10 min) in harmonized_donor_metadata.csv.

  kumar:
    paper: "Kumar et al. (2023) Nature 620:181-191"
    doi: "10.1038/s41586-023-06252-9"
    pmid: "37380767"
    protocol_class: variable_by_design
    consistent_within_study: false
    note: >
      Three dissociation protocols used by STUDY DESIGN to assess protocol bias:
      short (~1 h), medium (~6 h), long (~24 h). Donors equally distributed across
      protocols. Per-cell suspension_dissociation_time values in Seurat metadata
      reflect actual processing time per donor. This is the ONLY iHBCA study with
      within-study protocol heterogeneity. All other studies use consistent protocols
      absorbed by the study covariate.
    protocol_groups:
      short_enzymatic:
        description: "Short enzymatic dissociation, ~15 min trypsin"
        minutes: 15
      medium_digestion:
        description: "Medium overnight digestion, ~2 h"
        minutes: 120
      extended_digestion_3h:
        description: "Extended digestion, ~3 h"
        minutes: 180
      extended_digestion_4h:
        description: "Extended digestion, ~4 h"
        minutes: 240
      extended_digestion_6h:
        description: "Extended digestion, ~6 h"
        minutes: 360
      long_overnight:
        description: "Long overnight digestion, ~12 h"
        minutes: 720
      unknown:
        description: "Protocol not recorded (UCI cohort subset)"
        minutes: null
