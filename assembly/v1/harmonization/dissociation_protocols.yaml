  nee:
    paper: "Nee et al. (2023) Nat Genet 55:595-606"
    doi: "10.1038/s41588-023-01298-x"
    pmid: "37002399"
    protocol_class: enzymatic_short
    reagents: "20 U/ml DNase I"
    temperature_c: 37
    minutes_typical: 5
    consistent_within_study: true
    note: >
      Human tissue samples processed with DNase I for ~5 min.
      Separate collagenase 1h protocol used for mouse mammary glands (not human donors).
      All human donors receive consistent short enzymatic protocol.

  gray:
    paper: "Gray et al. (2022) Dev Cell 57:1400-1420"
    doi: "10.1016/j.devcel.2022.05.003"
    pmid: "35617956"
    protocol_class: collagenase_medium
    reagents: "Collagenase XI + TrypLE"
    temperature_c: 37
    minutes_collagenase: 120
    minutes_tryple: 5
    minutes_total: 125
    consistent_within_study: true
    note: >
      Tissue digested with collagenase XI at 37C 150 rpm for 2h (scRNA-seq),
      then further dissociated with TrypLE for 5 min. Consistent protocol across all donors.
      Long relative to Reed/Murrow/Nee but consistent, so absorbed by study covariate.

  twigger:
    paper: "Twigger et al. (2022) Nat Commun 13:562"
    doi: "10.1038/s41467-021-27895-0"
    pmid: "35091553"
    protocol_class: no_dissociation
    minutes_typical: null
    consistent_within_study: true
    note: >
      Cells isolated DIRECTLY from human milk — no enzymatic tissue dissociation.
      Fresh milk samples diluted in equal volume PBS and processed within <2h of
      collection. dissociation_minutes is not applicable for Twigger donors.

  murrow:
    paper: "Murrow et al. (2022) Cell Syst 13:644-664"
    doi: "10.1016/j.cels.2022.06.005"
    pmid: "35863345"
    protocol_class: enzymatic_short
    reagents: "0.05% Trypsin + 5 U/ml Dispase + 1 mg/ml DNase I"
    temperature_c: 37
    minutes_trypsin: 2
    minutes_dispase_dnase: 2
    minutes_total: 4
    consistent_within_study: true
    note: >
      Banked tissue fragments thawed and dissociated by trituration in 0.05% trypsin
      for 2 min, then trituration in dispase + DNase I for 2 min. Very short protocol.
      Consistent across all donors.

  pal:
    paper: "Pal et al. (2021) EMBO J 40:e107333"
    doi: "10.15252/embj.2020107333"
    pmid: "33950524"
    protocol_class: collagenase_long
    reagents: "Collagenase + 100 U/ml DNase I, then 0.25% Trypsin/EGTA"
    temperature_c: 37
    minutes_collagenase: 480  # 8h for normal tissue
    minutes_collagenase_max: 540  # up to 9h
    minutes_trypsin: 3
    consistent_within_study: true
    note: >
      Normal breast tissue digested for 8-9h with collagenase + DNase I at 37C with
      agitation, then trypsin/EGTA for 1-3 min to single-cell suspension.
      Long protocol but CONSISTENT across donors — absorbed by study covariate.
      Tumor tissue uses shorter protocol (up to 60 min) but iHBCA uses normal tissue only.
