  # Patient colors
  patient:
    Pat1: "#E41A1C"
    Pat2: "#377EB8"
    UCI604: "#4DAF4A"
    UCI220228: "#984EA3"

  # Fig 4 niche-classification palette — 16 keys
  # Compartment-coherent hue families distinct from l1.5; avoid green (reserved for Immune).
  # AS_1 → AS_3 ramps darkest → lightest within family (centroid-distance tertile bands).
  # _isolated keys are desaturated mid-tones for discrete clumps not adjacent to a contiguous structure.
  niche:
    # Duct family (blue tints)
    Duct_AS_1: "#1f4e79"
    Duct_AS_2: "#6fa8dc"
    Duct_AS_3: "#b4c7e7"
    Duct_isolated: "#9eb7d0"
    # TDLU family (purple tints)
    TDLU_AS_1: "#5b2e8a"
    TDLU_AS_2: "#9b7bbd"
    TDLU_AS_3: "#d1b8e5"
    TDLU_isolated: "#b8a0cf"
    # Stroma family (red/orange tints)
    Stroma_AS_1: "#a04000"
    Stroma_AS_2: "#d68a4c"
    Stroma_AS_3: "#f0c7a8"
    Stroma_isolated: "#c8a085"
    # Epidermal family (yellow/gold tints — sparse, 5 P3 samples only)
    Epidermal_AS_1: "#b8860b"
    Epidermal_AS_2: "#d4a83e"
    Epidermal_AS_3: "#ecd07a"
    Epidermal_isolated: "#c4a55a"

  # Fig 4 position-class palette — 18 keys
  # P-level depth: P1 neutral; P2 beige (NAC-adjacent); P3-A cool blue; P3-M green; P3-P warm purple.
  # Within each family, quadrant variation: UOQ emphasized (mid-saturated darker tone) since UOQ is the experimental focus.
  # Back-fills the CommoT scaffold's viridis 2-tone fallback (commot_xenium_pub_20260511/scripts/05_render_panels.py:50-59).
