# =============================================================================
# Submission v1 — Canonical Aesthetic Rules
# =============================================================================
# Single source of truth for all visual decisions in the Submission_v1 pipeline.
# All rendering scripts MUST consume this file via load_aesthetics.R or .py.
# No inline color definitions, no hardcoded dimensions.
#
# Palette keys match the canonical L1/L2 identifiers from summary_idents.csv.
# Display labels (short_label, descriptive_label) are read from that CSV at
# load time — NOT stored here. If nomenclature changes, update the CSV;
# hex values here remain stable unless the underlying types change.
#
# Generated from m2_visualization_candidates.Rmd:134-191 HSV logic.
# Pinned 2026-03-20. Do not regenerate — edit deliberately.
# =============================================================================

# --- Label Source ---
# Display labels come from this file. Palette keys here match l2_label column.
# load_aesthetics.R joins palette keys -> short_label at render time.
labels:
  source: summary_idents.csv   # relative to Analysis/Submission_v1/stages/S2_behavioral_groups/
  key_column: l2_label
  short_column: short_label
  descriptive_column: descriptive_label
  compartment_column: compartment

# --- Color Palettes ---
# Keys are canonical identifiers. Hex values pinned from HSV computation.
palettes:
  # Within-L2 NhoodGroup size rank (1 = largest viable group). Tol distinct
  # 10-color, colorblind-safe. Used by Fig 2 split-forest panel and any other
  # panel encoding NhoodGroup rank as a categorical variable.
  nhoodgroup_rank:
    "1":  "#332288"
    "2":  "#117733"
    "3":  "#44AA99"
    "4":  "#88CCEE"
    "5":  "#DDCC77"
    "6":  "#CC6677"
    "7":  "#AA4499"
    "8":  "#882255"
    "9":  "#999933"
    "10": "#661100"

  compartment:
    Stromal: "#D95F02"
    Epithelial: "#7570B3"
    Immune: "#1B9E77"
    Epidermal: "#E6AB02"

  # 7 contributing studies to iHBCA v1 atlas. Paul Tol "bright" colorblind-safe
  # qualitative 7-color, with olive #999933 replacing default Tol gray for
  # Twigger to disambiguate from the 'gray' study (which gets Tol blue).
  # Used by s1.3 study contribution stacked bar; locked 2026-05-22.
  study:
    gray:    "#4477AA"
    kumar:   "#EE6677"
    murrow:  "#228833"
    nee:     "#CCBB44"
    pal:     "#66CCEE"
    reed:    "#AA3377"
    twigger: "#999933"

  # LASP-override evidence (s1.5 supp): per-type tint (panel-b violin background)
  # + face (violin body) for the 3 LASP sub-types, plus background/zero grays
  # for panel-a Epi UMAP feature plots. Used by s1.5 composite (Atom 4); locked
  # 2026-05-22.
  lasp_override:
    LASP-major:
      tint: "#E6F0FA"          # light blue background
      face: "#86B6E0"          # violin body
    LASP-basal:
      tint: "#FAE6EE"          # light pink background
      face: "#E08AAE"          # violin body
    LASP-KIT:
      tint: "#FAEEE6"          # light orange background
      face: "#E0A876"          # violin body
    background_gray: "#BFBFBF" # panel-a non-LASP Epi cells
    zero_gray:       "#E5E5E5" # panel-a / panel-b zero-expression cells

  # FLEX cell-level QC status — used by Supp 1 (cell QC pair plot, attrition waterfall, filter UMAP)
  # and Supp 1.5 (manifold artifact gate). Locked 2026-05-08.
  # Discrete categorical for filter outcomes; sequential ramp for continuous QC scores.
  qc_status:
    kept: "#7570B3"                  # cells passing all QC stages (matches compartment.Epithelial blue)
    removed_initial: "#E08214"       # step 02-03: low UMI / high mito / doublet at cell QC
    removed_doublet: "#D6604D"       # step 03 (specific): scDblFinder doublets
    removed_sample_failed_vf: "#999999"  # step 04 sample-level: failed 100-VF threshold (Pat1_P3_M_UOQ, n=404)
    removed_manifold: "#9E2A2B"      # step 10b: manifold artifact gate (BigSur residual + depth filter)
    removed_contam: "#5C0E11"        # step 15: Milo contamination filter (epidermal exclusion)
    score_ramp_low: "#F0F0F0"        # 3-stop gray ramp for continuous QC scores
    score_ramp_mid: "#969696"
    score_ramp_high: "#252525"

  # Kumar 2023 transferred L1 cell-type labels — 13 types
  # Used by Supp 1.5a (Kumar cell-type UMAP). Locked 2026-05-08.
  # Per-compartment sequential ramps (compartment-coherent + within-compartment hue progression).
  kumar_l1:
    # Epithelial — sequential blues
    Basal: "#08519C"
    Luminal_HR: "#3182BD"
    Luminal_Secretory: "#6BAED6"
    PS_Epi: "#C6DBEF"
    # Stromal — sequential greens
    Fibroblast: "#006D2C"
    Pericyte: "#31A354"
    Vascular_Endothelium: "#74C476"
    Lymphatic_Endothelium: "#BAE4B3"
    Adipocyte: "#EDF8E9"
    # Immune — sequential oranges
    Myeloid: "#A63603"
    T_Cell: "#E6550D"
    B_Cell: "#FD8D3C"
    Mast: "#FDBE85"

  # iHBCA L1 (11 types) — canonical published resolution
  # Used for Fig 1 (iHBCA atlas) and cross-platform concordance
  l1:
    # Stromal (4 types)
    Fibroblast: "#D94E36"
    Lymphatic endothelial: "#D96636"
    Perivascular: "#D97D36"
    Vascular endothelial: "#D9C436"
    # Epithelial (4 types)
    Basal-myoepithelial: "#369ED9"
    Lactocyte: "#5C36D9"
    Luminal adaptive secretory precursor: "#364DD9"
    Luminal hormone sensing: "#7136D9"
    # Immune (3 types)
    B-lymphocyte: "#6AD936"
    Myeloid: "#36D94A"
    T-lymphocyte: "#52D936"

  # FLEX L1.0 (16 types) — iHBCA L1 base (11) + 5 cluster_annotation overrides
  # Used for Fig 3 (deep dive). Keys use short names (L1.0 column).
  # For xopt L0.5: drop pDC, PS_Epi, RBC → 13 types
  flex_l1.0:
    # Stromal (5 types)
    Adipo: "#D93636"
    Fibro: "#D94E36"
    LymphEndo: "#D96636"
    Peri: "#D97D36"
    VascEndo: "#D9C436"
    # Epithelial (4 types)
    Basal: "#369ED9"
    LumSec: "#364DD9"
    LumHR: "#7136D9"
    PS_Epi: "#9B36D9"
    # Immune (6 types)
    B_cells: "#6AD936"
    Myeloid: "#36D94A"
    T_cells: "#52D936"
    Mast: "#36D962"
    Neutro: "#36D979"
    pDC: "#36D9C1"
    # Other (1 type)
    RBC: "#D99536"

  # iHBCA L1.5 (20-22 types) — Austin's original finer annotations from Reed et al.
  # Used for supplemental atlas UMAP and L1.5 DA beeswarms.
  # Colors derived from L2 palette (_1 variant of each parent type).
  l1.5:
    # Stromal
    Adipocyte: "#990F0F"
    Fibroblast: "#99240F"
    Lymphatic endothelial: "#99380F"
    Perivascular: "#994B0F"
    RBC: "#D99536"
    Schwann cell: "#D9AD36"
    Vascular endothelial: "#99870F"
    # Epithelial
    Basal-myoepithelial: "#0F6799"
    Luminal adaptive secretory precursor: "#0F2399"
    Luminal hormone sensing: "#410F99"
    Lactocyte: "#5C36D9"
    # Immune
    B-cell: "#6AD936"
    Plasma cell: "#36D9A9"
    CD4T: "#52D936"
    CD8T: "#52D936"
    NK/NKT: "#0F995C"
    Macrophage: "#0F9920"
    Mast cell: "#36D962"
    Neutrophil: "#0F9948"
    Conventional dendritic cell: "#3BD936"
    Plasmacytoid dendritic cell: "#36D9C1"

  # 40 L2 types — saturation/value variants within parent L1 hue
  l2:
    # Stromal — Adipocyte (2)
    Adipocyte_1: "#990F0F"
    Adipocyte_2: "#F29191"
    # Stromal — Fibroblast (6)
    Fibroblast_1: "#99240F"
    Fibroblast_2: "#AB3622"
    Fibroblast_3: "#BD4C39"
    Fibroblast_4: "#CF6553"
