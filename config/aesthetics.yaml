    P2_LIQ: "#bca580"
    P2_LOQ: "#a07a4a"
    # P3 anterior sector (cool blue family)
    P3_A_UIQ: "#9ec2e8"
    P3_A_UOQ: "#5b8fbe"
    P3_A_LIQ: "#7daad1"
    P3_A_LOQ: "#3e6a98"
    # P3 medial sector (green family)
    P3_M_UIQ: "#a0c597"
    P3_M_UOQ: "#5d9051"
    P3_M_LIQ: "#7faa75"
    P3_M_LOQ: "#3f6f36"
    # P3 posterior sector (warm purple family — deepest)
    P3_P_UIQ: "#c192c6"
    P3_P_UOQ: "#8a4f9b"
    P3_P_LIQ: "#a874ad"
    P3_P_LOQ: "#6a3781"

# --- Dimensions (Nature guidelines) ---
# Nature: single column = 89mm (3.50in), double = 183mm (7.20in), max height = 247mm (9.72in)
dimensions:
  single_column_mm: 89
  double_column_mm: 183
  max_height_mm: 247
  panel_types:
    umap:
      width: 3.5
      height: 3.5
      pt_size: 0.05       # 258K cells — must be tiny for legibility
      stroke: 0
      alpha: 0.3
    umap_wide:             # with legend beside
      width: 5.0
      height: 3.5
      pt_size: 0.02
      stroke: 0
      alpha: 0.15
    dotplot:
      width: 7.2
      height: 4.0          # scale: add ~0.15in per group beyond 20
      dot_scale: 5
    heatmap_tile:
      width: 7.2
      height: 5.0          # scale: add ~0.12in per group beyond 25
    heatmap_pheatmap:
      width: 7.2
      height: 5.0
    stacked_bar:
      width: 7.2
      height: 3.0
    bar_horizontal:
      width: 3.5
      height: 4.0
    biplot:
      width: 5.0
      height: 4.5
    schematic:              # dataset overview, concentric circle diagram
      width: 7.2
      height: 5.0
    beeswarm_compact:       # joint-only DA beeswarm (~20-25 rows)
      width: 7.2
      height: 5.0
    beeswarm_tall:          # supplemental DA beeswarm with FLEX L2S (~50 rows)
      width: 7.2            # Nature double column (183mm)
      height: 9.72          # Nature max page height (247mm)
    biplot_network:          # circular node-edge network (28+ nodes)
      width: 7.8
      height: 7.8
    forest_split:            # split-violin / forest, 3 compartments — landscape, single figure row
      width: 9.4
      height: 3.9
    forest_multi_context:    # PxR-NG x 3-context forest (Fig 2 bottom-row MAIN). 37 NG rows x 3 cols.
      width: 7.2             # Nature double column (183mm)
      height: 7.9            # ~5.5mm per NG row x 37 rows + headers + axes
    alluvial_flow:           # donor flow alluvial — wide and short
      width: 8.6
      height: 3.5

# --- Typography ---
# Nature: sans-serif only (Helvetica or Arial), 5pt minimum, 7pt max body,
# 8pt bold lowercase panel labels. Consistent font across all figures.
typography:
  base_size: 7
  title_size: 8
  panel_label_size: 8           # bold, lowercase (a, b, c), upper-left corner
  legend_size: 6
  legend_title_size: 7
  axis_text_size: 6
  axis_title_size: 7
  strip_text_size: 7
  family: "Helvetica"           # fallback: Arial, then DejaVu Sans in container
  family_fallback: ["Arial", "DejaVu Sans"]
  min_pt: 5                     # Nature hard floor
  max_body_pt: 7                # Nature max for non-label text
  # How labels are displayed (not stored — resolved at render time from CSV)
  l1_labels: "as-is"       # use canonical L1 names
  l2_labels: "short"       # use short_label column from summary_idents.csv

# --- Element Density Rules ---
# Thresholds for legibility. Exceeding triggers warning in validate_panel().
density:
  umap_max_cells: 300000        # downsample (stratified) above this
  umap_alpha: 0.3               # transparency for point overlap
  heatmap_max_genes_per_group: 5
  heatmap_max_groups: 25        # split into sub-panels above this
  dotplot_max_genes_per_group: 3
  dotplot_max_groups: 20        # split or use landscape above this
  stacked_bar_max_categories: 15  # combine rare into "Other" above this
  legend_max_items: 20          # wrap or abbreviate above this
  min_font_pt: 5                # hard floor — Nature minimum

# --- Rendering Rules ---
# Nature specs: vector PDF primary, 1200 DPI for rasterized scatter (Noah pref 2026-05-07
# — Nature 600 DPI minimum is too low for scientific reproduction); 300 DPI minimum for
# photographs; extended data 300 DPI max.
rendering:
  raster: false                 # ALWAYS false for Seurat/ggplot publication vectors
  dpi: 1200                     # Bumped 600→1200 (2026-05-07): rasterized panel content
  dpi_extended_data: 300        # Online-only extended data: 300 DPI max
  dpi_umap_raster: 1200         # Rasterized scatter inside vector PDF wrapper (UMAPs, pair plots)
  format:
    - pdf                       # primary (vector, editable text)
    - png                       # convenience preview (at full DPI)
  background: "white"
  antialias: "default"
  font_embedding: "TrueType"   # TrueType 2 or 42; avoid TrueType 3
  text_outlined: false          # Nature requires editable text — do NOT outline

# --- Line Weights (Nature specs) ---
line_weights:
  minimum: 0.25                 # pt — Nature hard minimum
  axes: 0.6                     # pt — axes and tick marks
  scale_bar: 0.6                # pt — scale bars (separate editable layer)
  border: 0.5                   # pt — panel borders if used
  grid: null                    # Nature: no background gridlines

# --- Continuous Color Scales ---
scales:
  expression_diverging:
    low: "#2166AC"
    mid: "#F7F7F7"
    high: "#B2182B"
  abundance_sequential:
    low: "#FFFFFF"
    high: "#08519C"
  purity_sequential:
    low: "#FEE0D2"
    high: "#DE2D26"
  position_diverging:           # for PC loading maps
    low: "#313695"
    mid: "#FFFFFF"
    high: "#A50026"

