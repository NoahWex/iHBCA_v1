    # Epithelial — Basal-myoepithelial (4)
    Basal-myoepithelial_1: "#0F6799"
    Basal-myoepithelial_2: "#3186B7"
    Basal-myoepithelial_3: "#5CA9D4"
    Basal-myoepithelial_4: "#91CFF2"
    # Epithelial — LASP (3)
    Luminal adaptive secretory precursor_1: "#0F2399"
    Luminal adaptive secretory precursor_2: "#4557C6"
