# ==============================================================================
# Container Registry - Available HPC Singularity Containers
# ==============================================================================
# Central registry for all containers used in preprocessing and analysis.
# Reference this file when declaring container requirements in experiments.
#
# Usage in experiment_metadata.yaml:
#   container_requirements:
#     annotation: Python_Spatial_2025Q2
#     notebooks: R_Spatial_4.3.3
# ==============================================================================

