# ==============================================================================
# Bind Mounts (Required for all containers)
# ==============================================================================

bind_mounts:
  required:
    - "/share/crsp/lab/dalawson/share"      # Raw data (CellRanger outputs)
    - "/share/crsp/lab/dalawson/nwechter"   # Project directory
    - "/scratch"                             # Temporary files
    - "/data/homezvol0/nwechter"            # User home (for pip --user and R user libs)

# ==============================================================================
# User-Installed Python Packages (Conda/Mamba)
# ==============================================================================
# Singularity containers have read-only /home/jovyan and block HOME override.
# RECOMMENDED: Use conda/mamba environments for user-installed packages.
# Reference: https://rcic.uci.edu/software/user-installed.html

conda_environments:
  # Mamba module (faster than conda)
  module: "mamba/24.3.0"

  # Default environment location
  env_location: "~/.conda/envs"

  # Defined environments
  environments:
    celltypist_env:
      description: "CellTypist annotation with scanpy"
      conda_packages:
        - python=3.10
        - scanpy
        - pandas
        - numpy
        - scikit-learn
      pip_packages:
        - celltypist  # PyPI only, not on conda-forge
      channel: conda-forge
      created: "2025-12-16"
      use_cases:
        - ihbca_annotation experiment
        - Cell type annotation

  setup: |
    # One-time setup: Request interactive node
    srun -c 2 -p free --pty /bin/bash -i

    # Load mamba and create environment with dependencies
    module load mamba/24.3.0
    mamba create -n celltypist_env -c conda-forge python=3.10 scanpy pandas numpy scikit-learn -y

    # Activate and pip install celltypist (PyPI only)
    source activate celltypist_env
    pip install celltypist

    # Clean cache (saves disk space)
    conda clean -a -f -y

  slurm_usage: |
    # Add to SLURM scripts (instead of singularity exec)
    module load mamba/24.3.0
    source activate celltypist_env
    python3 your_script.py

  interactive_usage: |
    # For interactive work
    module load mamba/24.3.0
    source activate celltypist_env

# ==============================================================================
# Verification Commands
# ==============================================================================
# Use these to check package availability in containers

verification_commands:
  celltypist: "python3 -c \"import celltypist; print(f'celltypist {celltypist.__version__}')\""
  scanpy: "python3 -c \"import scanpy; print(f'scanpy {scanpy.__version__}')\""
  scvi: "python3 -c \"import scvi; print(f'scvi-tools {scvi.__version__}')\""
  seurat: "Rscript -e \"packageVersion('Seurat')\""

# ==============================================================================
# Interactive Session Template
# ==============================================================================
# Copy-paste commands for interactive container testing

interactive_session:
  request_node: |
    # Request interactive node (standard partition)
    srun --pty --partition=standard --account=dalawson_lab --cpus-per-task=4 --mem=16G --time=01:00:00 /bin/bash

  request_gpu_node: |
    # Request interactive GPU node
    srun --pty --partition=gpu --account=dalawson_lab --cpus-per-task=4 --mem=16G --gres=gpu:1 --time=01:00:00 /bin/bash

  launch_container: |
    # Launch container (replace CONTAINER_IMAGE with path from registry)
    singularity exec \
      -B /share/crsp/lab/dalawson/share \
      -B /share/crsp/lab/dalawson/nwechter \
      -B /scratch \
      CONTAINER_IMAGE \
      /bin/bash
