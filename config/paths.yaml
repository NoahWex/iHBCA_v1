  hpc: /share/crsp/lab/dalawson/nwechter
  local: "/Users/NoahWechter/Library/Application Support/CRSP Desktop/Volumes.noindex/CRSP Lab - dalawson.localized/nwechter"
  # Shared lab paths (not under user root — environment-independent)
  shared_datasets: /share/crsp/lab/dalawson/share/3_Downloaded_Datasets
