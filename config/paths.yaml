# paths.yaml — Single source of truth for path resolution
# All scripts source this instead of hardcoding paths.
# Supports HPC (direct filesystem) and local (CRSP SMB mount).

# Environment detection: set IHBCA_ENV=hpc or IHBCA_ENV=local to override.
# If unset, auto-detects based on hostname.
environment: auto

# Root directories per environment
