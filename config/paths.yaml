  # ---- Collaborator-delivered substrate (read-only; not promoted) ----
  # Gautham SpaceFlow per-cell structure classification on the Xenium cohort.
  # Delivered 2026-05-12 as 65 per-sample annotated h5ad files (667MB total).
  # Schema (per file):
  #   obs:   patient_id, xenium_id, p_level, is_uoq, l0p5, domain_id,
  #          spaceflow_domain, structure_confidence,
  #          structure_label          (broad: Duct / Stroma / TDLU / Unknown
  #                                    + sparse Epidermal),
  #          structure_label_discrete (per-instance: {Class}_{idx} or
  #                                    {Class}_isolated; sample-local --
  #                                    consumers prepend sample-ID for
  #                                    global uniqueness)
  #   obsm:  X_spaceflow (graph embedding), spatial (raw tissue coords)
  #   uns:   n_discrete_structures
  #   cell-ID: {patient_sample}_xenium_{N}__{barcode}-{N} (double underscore)
  # Cohort cardinality (1,069,321 cells total across 65 samples):
  #   Stroma 399,468 / Unknown 368,257 / TDLU 190,299 / Duct 106,563 /
  #   Epidermal 4,734.  Unknowns = QC drops (filter at pipeline entry).
  # Per-class instance count caps per sample: Duct <=30, TDLU <=32,
  #   Stroma <=121, Epidermal <=10.
  # First consumer: Fig 4 Lane C (niche-DA + position x niche heatmap).
  # If/when promoted: copy under publication/preprocessing/xenium/spaceflow/
  #   and re-point this token to the promoted location.
  # Corrected 2026-05-22: points at annotated_corrected/ (Gautham's revised
  # delivery with the structure_label_discrete column the motifs pipeline
  # consumes). The earlier annotated/ delivery is superseded.
  xenium_spaceflow_dir: /share/crsp/lab/dalawson/share/Nee_Xenium/gautham/spaceflow_domains/annotated_corrected/
  flex_integration_intermediate: iHBCA_publication/publication/preprocessing/chromium_spatial/outputs/integration_intermediate
