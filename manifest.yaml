    dry_run_scope: "paths.yaml resolution (16 tokens, all PASS), entry-point parse (35/46 PASS, 3 container-only deferred, 7 no-help-guard non-blocking, 1 critical literal-tokens bug surfaced and confirmed systemic across ~19 scripts)"
