bundle_1_2_joint_anatomic_amendment_20260517:
  entries:
    - source: Spatial_HBCA_Xenium/DifferentialAbundance/joint_anatomic_variation_20260424/outputs/da/
      destination: publication/analysis/abundance/spatial/joint/results/
      files:
        - c2a/M0/da_results.csv      # P3 A vs M (depth axis A), now quadrant-blocked
        - c2b/M0/da_results.csv      # P3 P vs M (depth axis P), now quadrant-blocked
        - c3/M0/da_results.csv       # P3 UOQ vs rest, now depth-blocked (REPLACES 2026-05-03 version)
        - c3a/M0/da_results.csv      # P3 UIQ vs rest, depth-blocked (NEW)
        - c3b/M0/da_results.csv      # P3 LOQ vs rest, depth-blocked (NEW)
        - c3c/M0/da_results.csv      # P3 LIQ vs rest, depth-blocked (NEW)
        - c2a/M0/run_log.yaml
        - c2b/M0/run_log.yaml
        - c3/M0/run_log.yaml
        - c3a/M0/run_log.yaml
        - c3b/M0/run_log.yaml
        - c3c/M0/run_log.yaml
        - quadrant_family/family_fdr.csv      # Joint BH across 4 quadrant tests (NEW)
        - quadrant_family/summary.md          # Per-contrast n_sig at family_FDR<0.05/0.1 + cross-contrast overlap
      validation_gate: |
        Row count: each da_results.csv == 61889 (joint_full nhoods).
        Family BH: family_fdr.csv has 247556 rows (4 × 61889), family_FDR_BH all non-NA, 4 contrasts represented.
        Sign convention: median Treg logFC in C3 = +1.63 (UOQ enriched, second YAML level); median LASP-basal logFC in C3 = -1.11 (depleted in UOQ, opposite NAC direction). Both verified.
        No NA in Nhood column. 100% nhood_label_l1p5 coverage on all 6 files.
        SpatialFDR distribution sanity: NEW C3 marginally more conservative than OLD (extra 2 DF for axis_amp block); no pathological shifts.
      validation_result: pass
      promote_date: "2026-05-17"
      promoted_by: coordinator_session_20260517
      notes: |
        Quadrant family expansion for within-P3 anatomic DA. Adds 3 new contrasts (UIQ, LOQ, LIQ vs rest)
        parallel to the existing UOQ contrast. Adds cross-blocking: depth tests (C2a/b) now condition on
        quadrant (4-level); quadrant tests (C3/C3a/b/c) now condition on antero-posterior depth (axis_amp).
        Family-wise BH adjustment across the 4 quadrant tests computed in addition to per-contrast SpatialFDR.

        Biology preservation verified:
          - LASP-basal in NAC (C1, unchanged contrast): 866/1681 sig+NAC, median logFC 0.89 — INTACT.
          - CD4 Treg in UOQ (C3, depth-blocked): 64/87 sig+UOQ (was 67/87), median logFC 1.63 (was 1.70),
            same-nhood logFC correlation 0.995. Headline biology preserved.
          - NEW: Treg quadrant asymmetry — sig+UOQ enrichment in C3, sig+UIQ depletion in C3a,
            weaker depletion in LOQ/LIQ. Counter-signal in UIQ strengthens UOQ-as-risk narrative.

        Bridge drift flagged: pipeline/outputs/annotations/joint_l1p5.csv was updated between
        May-8 and May-17. L1.5 label set changed (BMYO/BMYO-NC -> BMYO-myo; Endothelial split to add
        Vas-capillary). 29/31 labels stable. Treg/T/B/Plasma/LASP comparisons valid; BMYO/Endothelial
        deltas partly bridge-driven. Independent of this amendment.

        M1/M2 sensitivity tiers for C3 NOT promoted (per existing M-4a §3.3 policy: only M0 promoted).
        Per-compartment scopes (joint_Epithelial/Immune/Stromal) NOT in this bundle
        (per user directive 2026-05-17: not interesting; infrastructure preserved for future ad-hoc runs).

    # === Runner + post-processor replacement (2026-05-17) ===

    - source: Spatial_HBCA_Xenium/DifferentialAbundance/joint_anatomic_variation_20260424/scripts/da/01_run_contrast.R
      destination: publication/analysis/abundance/spatial/joint/02_run_contrast.R
      files: [02_run_contrast.R]
      validation_gate: |
        Pure argparse (7 required flags). No hardcoded absolute paths.
        Extended dispatch: build_factor_col now handles is_uiq/is_loq/is_liq via existing quadrant column.
        Pre-derives axis_amp on covars before formula parsing so blocking-term formulas work.
        Subset test job 52463732 passed (C3a joint_Immune M0): 95x9 design, 87/176 sig at FDR<0.05/<0.1.
      validation_result: pass
      promote_date: "2026-05-17"
      promoted_by: coordinator_session_20260517
      notes: |
        Amendment to 2026-05-03 promotion. Replaces the original 02_run_contrast.R with the updated runner
        that supports the quadrant family contrasts. Original runner functionality preserved
        for C1/C2/C3 baseline cases.

    - source: Spatial_HBCA_Xenium/DifferentialAbundance/joint_anatomic_variation_20260424/scripts/da/04_joint_bh_quadrant_family.R
      destination: publication/analysis/abundance/spatial/joint/04_joint_bh_quadrant_family.R
      files: [04_joint_bh_quadrant_family.R]
      validation_gate: |
