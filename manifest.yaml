# manifest.yaml — Global promotion manifest
# Every file promoted from a development repo is logged here.
# This is the audit trail for code provenance in the public-facing repo.
#
# Schema per entry:
#   source:            Path in source repo (relative to nwechter/)
#   destination:       Path in iHBCA_publication/ (relative to repo root)
#   files:             List of files promoted
#   validation_gate:   Expression checked before promotion (row counts, file presence)
#   validation_result: pass | fail | pending
#   promote_date:      ISO date
#   promoted_by:       Session ID or agent name
#   notes:             Optional context

version: "1.0"
created: "2026-03-23"

promotions:
