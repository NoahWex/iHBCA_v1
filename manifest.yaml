        Reads the 4 quadrant per-contrast da_results.csv, pools raw p-values, BH-adjusts.
        Writes family_fdr.csv (4 x n_nhoods rows) + quadrant_family_summary.md.
        Verified on joint_full M0 (job batch 52463879-52463911): produced 247556-row family_fdr.csv with 4 contrasts.
      validation_result: pass
      promote_date: "2026-05-17"
      promoted_by: coordinator_session_20260517
      notes: |
        NEW post-processor. Computes family-wise BH adjustment across the 4 quadrant tests
        (C3 UOQ, C3a UIQ, C3b LOQ, C3c LIQ). Retains per-contrast SpatialFDR_per_contrast
        alongside the new family_FDR_BH for downstream reporting flexibility.

    - source: Spatial_HBCA_Xenium/DifferentialAbundance/joint_anatomic_variation_20260424/experiment_metadata.yaml
      destination: publication/analysis/abundance/spatial/joint/experiment_metadata.yaml
      files: [experiment_metadata.yaml]
