    destination: publication/config/
    files: [aesthetics.yaml, load_aesthetics.R, load_aesthetics.py, provenance_schema.yaml]
    validation_gate: "all files exist and are valid YAML/R/Python"
    validation_result: pass
    promote_date: "2026-03-23"
    promoted_by: ihbca_publication_architecture_plan
    notes: "Rendering infrastructure. load_aesthetics.R updated to check publication/config/ path first. L1 (19) + L2 (40) palettes, Nature-compliant dimensions, 7pt base typography."

